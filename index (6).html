<style>
:root{--navy:#151515;--navy2:#2a2a2a;--blue:#de0702;--green:#16a34a;--red:#8f0401;--bg:#f4f4f5;--card:#fff;--tx:#141414;--mut:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--blue);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn.gr{background:var(--green)}.btn.rd{background:var(--red)}.btn.gh{background:#e2e8f0;color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.85rem}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1e3a8a);padding:16px}
.lbox{background:#fff;border-radius:18px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 50px #0006}
.lbox h1{color:var(--navy);text-align:center;margin-bottom:4px}.lbox .sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:.9rem}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue)}
.err{color:var(--red);font-size:.9rem;min-height:20px;margin-bottom:8px}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.lbox .btn{width:100%;padding:12px}
/* admin */
.shell{display:flex;min-height:100vh}
.side{width:240px;background:var(--navy);color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side h2{color:#fff;font-size:1.1rem;padding:0 10px 16px}
.side a{display:block;padding:11px 14px;border-radius:10px;cursor:pointer}
.side a:hover{background:var(--navy2)}.side a.on{background:var(--blue);color:#fff}.side .sp{flex:1}
.main{flex:1;padding:24px;min-width:0}
.top{display:none;background:var(--navy);color:#fff;padding:10px 14px;align-items:center;gap:12px}
.top button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.hd h2{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.st{background:var(--card);border-radius:14px;padding:20px;border-inline-start:5px solid var(--blue);box-shadow:0 1px 4px #0001}
.st b{display:block;font-size:2rem;color:var(--navy)}.st span{color:var(--mut)}
.tw{background:var(--card);border-radius:14px;overflow-x:auto;box-shadow:0 1px 4px #0001}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--bd)}
th{background:#f8fafc;color:var(--mut);font-size:.85rem}
td .btn{margin-inline-end:6px}
.badge{padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600}.badge.a{background:#dcfce7;color:#166534}.badge.i{background:#fee2e2;color:#991b1b}
.empty{padding:28px;text-align:center;color:var(--mut)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;text-align:start}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 4px #0001;margin-bottom:16px;max-width:520px}
.card h3{margin-bottom:12px;color:var(--navy)}
/* user */
.uhead{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uhead h1{font-size:1.25rem}.uhead small{color:#94a3b8;display:block}
.uwrap{max-width:900px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{background:var(--card);border:2px solid transparent;border-radius:14px;padding:24px 18px;cursor:pointer;text-align:start;box-shadow:0 1px 5px #0001;transition:.15s;width:100%}
.cc:hover{border-color:var(--blue);transform:translateY(-2px)}
.cc b{display:block;font-size:1.2rem;color:var(--navy);margin-bottom:6px}.cc span{color:var(--mut);font-size:.9rem}
.cc.code b{margin:0;font-size:1.15rem}
.list{display:flex;flex-direction:column;gap:12px}
.ci{background:var(--card);border-radius:14px;box-shadow:0 1px 5px #0001;border:2px solid transparent;overflow:hidden;transition:border-color .25s}
.ci.open{border-color:var(--green)}
.ci .cc{display:flex;justify-content:space-between;align-items:center;box-shadow:none;border:0;border-radius:0;background:none;padding:20px 18px}
.ci .cc:hover{transform:none;background:#f8fafc}
.ci .cc i{font-style:normal;color:var(--mut);transition:transform .35s}
.ci.open .cc i{transform:rotate(180deg)}
.cx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.ci.open .cx{grid-template-rows:1fr}
.cin{overflow:hidden;min-height:0;text-align:center;padding:0 16px;opacity:0;transition:opacity .3s,padding .35s}
.ci.open .cin{opacity:1;padding:4px 16px 20px}
.ci.open .big{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.grid.gs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gs .cc{text-align:center;padding:18px 10px;display:flex;align-items:center;justify-content:center;min-height:76px}
.gs .cc b{margin:0;font-size:1rem}.cc:active{transform:scale(.97)}
.pov{position:fixed;inset:0;background:#0f1f3d99;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px;animation:fd .2s;cursor:pointer}
.pbox{background:#fff;border-radius:22px;padding:26px 24px 0;text-align:center;width:min(92vw,520px);overflow:hidden;box-shadow:0 20px 60px #0006;animation:pp .38s cubic-bezier(.2,1.3,.4,1)}
.pnm{color:var(--mut);font-size:1.15rem}.pok{color:var(--green);font-weight:700}
.pbar{height:6px;background:#e2e8f0;margin:18px -24px 0}.pbar i{display:block;height:100%;background:var(--green);animation:shr 3s linear forwards}
@keyframes fd{from{opacity:0}}@keyframes pp{from{transform:scale(.6);opacity:0}}@keyframes shr{from{width:100%}to{width:0}}
.bk{margin-bottom:16px}.ttl{color:var(--navy);margin-bottom:16px}
.show{background:var(--card);border-radius:18px;padding:30px 20px;text-align:center;box-shadow:0 2px 10px #0002}
.show .nm{color:var(--mut);font-size:1.2rem;margin-bottom:12px}
.big{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;font-size:clamp(2.4rem,9vw,5rem);font-weight:800;color:var(--green);background:#f0fdf4;border:2px dashed var(--green);border-radius:14px;padding:22px 10px;margin:10px 0 18px;word-break:break-all;user-select:all}
.ds{color:var(--mut);margin-bottom:16px}
/* overlay */
.ov{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
.md{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.md h3{margin-bottom:14px;color:var(--navy)}.md p{margin-bottom:18px;line-height:1.7}
.row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.tt{background:var(--green);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;box-shadow:0 6px 20px #0004;animation:in .2s}.tt.err{background:var(--red)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
@media(max-width:800px){
.top{display:flex}.shell{flex-direction:column}
.side{position:fixed;top:0;bottom:0;right:-260px;z-index:40;width:240px;transition:.2s}.side.open{right:0}
.main{padding:14px}.lbox{padding:24px}}
/* ===== Theme: red / black / white ===== */
.btn.gr{background:#151515}
.err{color:#b00602}
.login{background:radial-gradient(circle at 15% 20%,#de070266 0,transparent 45%),radial-gradient(circle at 90% 90%,#de070240 0,transparent 42%),#121212}
.lbox{border-top:6px solid #de0702}
.lg{width:64px;height:64px;border-radius:18px;background:#de0702;color:#fff;font:800 1.5rem/64px Arial,sans-serif;text-align:center;margin:0 auto 14px;box-shadow:0 8px 20px #de070266}
.lbox h1{color:#151515}
.uhead,.top{border-bottom:4px solid #de0702}
.side a.on{background:#de0702}
.big{color:#de0702;background:#fdf4f3;border-color:#de0702}
.pbar i{background:#de0702}.pok{color:#151515}
.cc{border-color:#e5e7eb}.cc:hover{border-color:#de0702}
.st{border-inline-start-color:#de0702}
th{background:#fafafa}
/* ===== Folders + search ===== */
.uwrap{max-width:1200px}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:4px 14px;margin-bottom:20px;box-shadow:0 1px 5px #0001}
.sb:focus-within{border-color:#de0702}
.sb input{flex:1;border:0;outline:0;padding:12px 4px;font-size:1.1rem;background:none;min-width:0}
.sb .x{border:0;background:#e5e7eb;border-radius:99px;width:30px;height:30px;cursor:pointer}.sb .x[hidden]{display:none}
.sh{color:#151515;margin:6px 0 12px;font-size:1rem}.sh:not(:first-child){margin-top:24px}
.grid.fo5{grid-template-columns:repeat(5,1fr);gap:14px}
@media(max-width:1000px){.grid.fo5{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.grid.fo5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.grid.fo5{grid-template-columns:repeat(2,1fr);gap:10px}}
.fo{position:relative;background:linear-gradient(#fff,#fff6f5);border:2px solid #e5e7eb;border-radius:4px 14px 14px 14px;padding:30px 10px 18px;margin-top:12px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 5px #0001;min-height:112px}
.fo .ft{position:absolute;top:-13px;inset-inline-start:-2px;width:46%;height:14px;background:#de0702;border-radius:8px 8px 0 0}

.fo b{display:block;font-size:1.05rem;color:#151515;margin-bottom:6px}.fo small{color:var(--mut)}
.gs .cc{flex-direction:column}.cc small{display:block;color:var(--mut);margin-top:5px;font-size:.78rem;font-weight:400}
.bn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fdf4f3;border:2px solid #de0702;border-radius:12px;padding:12px 16px;margin-bottom:16px}

.hd .ttl{margin:0}.ck{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:.9rem;cursor:pointer}

/* ===== Login (e&) ===== */
.login{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:#0c0c0d;position:relative;overflow:hidden;padding:20px}
.login::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 85% 10%,#de070238 0,transparent 70%),radial-gradient(50% 45% at 10% 95%,#de070226 0,transparent 70%);pointer-events:none}
.login::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff0f 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 20%,transparent 100%);pointer-events:none}
.lc{position:relative;z-index:1;width:100%;max-width:900px;display:grid;grid-template-columns:1fr 1.05fr;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 90px #000a,0 0 0 1px #ffffff14;animation:lcin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes lcin{from{opacity:0;transform:translateY(24px) scale(.98)}}
.lbrand{position:relative;background:#de0702;color:#fff;padding:44px 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;overflow:hidden}
.lbrand::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid #ffffff2e;top:-170px;left:-170px}
.lbrand::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,#ffffff1c 0,transparent 65%);bottom:-260px;right:-200px}
.lbrand img{position:relative;z-index:1;width:min(230px,62%);height:auto;display:block;filter:drop-shadow(0 10px 24px #6a030033)}
.lbrand h2{position:relative;z-index:1;font-size:1.5rem;font-weight:700;letter-spacing:.2px;direction:ltr}
.lbrand p{position:relative;z-index:1;font-size:.98rem;line-height:1.8;color:#ffe9e7;max-width:280px;margin:-14px auto 0}
.lform{padding:46px 42px;display:flex;flex-direction:column;justify-content:center;background:#fff}
.lform h1{font-size:1.7rem;font-weight:700;color:#141414;margin:0 0 6px}
.lform .lsub{color:#6b7280;font-size:.95rem;margin-bottom:28px}
.lf{margin-bottom:16px}
.lf label{display:block;font-weight:600;font-size:.88rem;color:#2b2b2b;margin-bottom:7px}
.lw{position:relative}
.lw svg.ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#9ca3af;transition:color .2s;pointer-events:none}
.lw input{width:100%;padding:13px 44px;border:1.5px solid #e5e7eb;border-radius:13px;background:#f8f8f9;font-size:1rem;color:#141414;transition:border-color .2s,background .2s,box-shadow .2s;direction:ltr;text-align:start}
.lw input::placeholder{color:#a3a3ab}
.lw input:hover{border-color:#d1d5db}
.lw input:focus{outline:0;border-color:#de0702;background:#fff;box-shadow:0 0 0 4px #de070218}
.lw:focus-within svg.ic{color:#de0702}
.eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:9px;cursor:pointer;color:#9ca3af;display:grid;place-items:center;transition:background .15s,color .15s}
.eye:hover{background:#f0f0f1;color:#141414}
.eye:focus-visible{outline:2px solid #de0702;outline-offset:1px}
.eye svg{width:19px;height:19px}
.rem{display:flex;align-items:center;gap:10px;margin:4px 0 6px;cursor:pointer;user-select:none;width:fit-content}
.rem input{position:absolute;opacity:0;width:0;height:0}
.rem .bx{width:20px;height:20px;border-radius:6px;border:1.5px solid #cfd2d8;background:#fff;display:grid;place-items:center;transition:all .18s;flex-shrink:0}
.rem .bx svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.5);transition:all .18s}
.rem input:checked+.bx{background:#de0702;border-color:#de0702}
.rem input:checked+.bx svg{opacity:1;transform:scale(1)}
.rem input:focus-visible+.bx{box-shadow:0 0 0 4px #de070228}
.rem span.tx{font-size:.92rem;color:#3a3a3f;font-weight:500}
.lform .err{min-height:22px;margin:6px 0 8px;font-weight:500}
.lbtn{width:100%;border:0;border-radius:13px;padding:14px;font-size:1.05rem;font-weight:700;color:#fff;background:#de0702;cursor:pointer;box-shadow:0 10px 22px #de070240;transition:transform .15s,box-shadow .2s,background .2s}
.lbtn:hover{background:#b00602;box-shadow:0 14px 28px #de070252}
.lbtn:active{transform:scale(.98)}
.lbtn:focus-visible{outline:3px solid #141414;outline-offset:2px}
@media(max-width:760px){
.lc{grid-template-columns:1fr;max-width:440px}
.lbrand{padding:28px 24px 26px;gap:12px}
.lbrand img{width:120px}
.lbrand h2{font-size:1.15rem}
.lbrand p{display:none}
.lform{padding:28px 24px 30px}
.lform h1{font-size:1.45rem}
.lform .lsub{margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){.lc{animation:none}.lw input,.lbtn,.rem .bx,.rem .bx svg{transition:none}}

/* ===== App shell (e&) ===== */
:root{--line:#e8e8ec}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;background:#f4f4f6;color:#141416}
button,input,select,textarea{font-family:inherit}
.btn{border-radius:11px;font-weight:600;transition:background .15s,color .15s,transform .1s,box-shadow .15s}
.btn:hover{filter:none;background:#b00602}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.side a:focus-visible,.fo:focus-visible,.cc:focus-visible{outline:3px solid #14141666;outline-offset:2px}
.btn.gr{background:#1b1b1f}.btn.gr:hover{background:#000}
.btn.gh{background:#ececf0;color:#1d1d21}.btn.gh:hover{background:#e0e0e6}
.btn.rd{background:#faeceb;color:#a82822}.btn.rd:hover{background:#b00602;color:#fff}
.md .btn.rd{background:#de0702;color:#fff}.md .btn.rd:hover{background:#b00602}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* admin */
.side{background:#0f0f11;color:#b4b4bd;padding:18px 14px;gap:3px}
.sbrand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;margin-bottom:12px;border-bottom:1px solid #ffffff14}
.sbrand img{width:48px;height:auto;flex-shrink:0}
.sbrand b{display:block;color:#fff;font-size:.95rem;line-height:1.3;direction:ltr;text-align:start}
.sbrand small{color:#8a8a94;font-size:.76rem}
.side a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:#b4b4bd;font-weight:500;position:relative;transition:background .15s,color .15s}
.side a svg{width:19px;height:19px;flex-shrink:0}
.side a:hover{background:#ffffff10;color:#fff}
.side a.on{background:#de070226;color:#fff}
.side a.on svg{color:#e8736b}
.side a.on::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:4px;border-radius:4px;background:#de0702}
.side a.lo{color:#e89a94}.side a.lo:hover{background:#de070226;color:#fff}
.suser{padding:12px 10px 8px;margin-top:10px;border-top:1px solid #ffffff14;font-size:.78rem;color:#8a8a94;word-break:break-all;direction:ltr;text-align:start}
.main{padding:30px 34px;max-width:1320px}
.hd{margin-bottom:22px}
.hd h2{font-size:1.5rem;font-weight:700;color:#121214}
.stats{gap:16px}
.st{display:flex;align-items:center;gap:16px;border:0;border-radius:18px;padding:22px;background:#fff;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a}
.st .si{width:52px;height:52px;border-radius:15px;background:#de070214;color:#de0702;display:grid;place-items:center;flex-shrink:0}
.st .si svg{width:25px;height:25px}
.st b{font-size:2rem;line-height:1;font-weight:700;color:#121214}
.st span{display:block;margin-top:7px;font-size:.88rem;color:#74747e}
.tw{border-radius:18px;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a}
th,td{padding:14px 18px;border-bottom:1px solid var(--line)}
th{background:#fafafb;font-weight:600;font-size:.8rem;color:#74747e}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafafb}
.badge{font-weight:600}
.card{border-radius:18px;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a;padding:24px}
.card h3{font-size:1.05rem;color:#121214}
.empty{padding:48px 20px;color:#8a8a94}
.top{background:#0f0f11;border-bottom:3px solid #de0702;padding:10px 14px}
.top img{height:32px;width:auto}
.top b{font-size:.95rem;direction:ltr}
.top button{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:#ffffff14}
.top button svg{width:22px;height:22px}
/* user */
.uhead{background:#0f0f11;border-bottom:0;padding:14px 28px;position:sticky;top:0;z-index:30}
.uhead::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:#de0702}
.ubrand{display:flex;align-items:center;gap:14px;min-width:0}
.ubrand img{height:46px;width:auto;flex-shrink:0}
.ubrand .vr{width:1px;height:36px;background:#ffffff26;flex-shrink:0}
.uhead h1{font-size:1.1rem;font-weight:700;direction:ltr;text-align:start}
.uhead small{color:#9a9aa4;font-size:.84rem;margin-top:2px}
.uhead .btn.gh{background:#ffffff14;color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.uhead .btn.gh:hover{background:#ffffff26}
.uhead .btn svg{width:16px;height:16px}
.uwrap{max-width:1200px;padding:28px 24px 56px}
.sb{border:1.5px solid var(--line);border-radius:16px;padding:6px 18px;margin-bottom:26px;box-shadow:0 1px 2px #0000000a;transition:border-color .2s,box-shadow .2s}
.sb:focus-within{border-color:#de0702;box-shadow:0 0 0 4px #de070216}
.sbi{display:grid;place-items:center;color:#9a9aa4;transition:color .2s}
.sbi svg{width:22px;height:22px}
.sb:focus-within .sbi{color:#de0702}
.sb input{font-size:1.05rem}
.sh{font-weight:700;font-size:1.05rem}
.ttl{font-size:1.45rem;font-weight:700}
.grid.fo5{gap:16px}
.fo{background:#fff;border:0;border-radius:18px;padding:24px 14px 20px;margin-top:0;min-height:138px;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .18s,box-shadow .18s}
.fo .fi{width:54px;height:54px;border-radius:16px;background:#de070214;color:#de0702;display:grid;place-items:center;margin-bottom:8px;transition:background .18s,color .18s}
.fo .fi svg{width:26px;height:26px}
.fo:hover{border:0;transform:translateY(-3px);box-shadow:0 0 0 1.5px #de0702,0 14px 28px #de07021f}
.fo:hover .fi{background:#de0702;color:#fff}
.fo b{margin:0;font-size:1.02rem;color:#141416}
.fo small{background:#f1f1f4;border-radius:99px;padding:2px 11px;font-size:.76rem;color:#6b6b75}
.cc.code,.gs .cc{background:#fff;border:0;border-radius:16px;box-shadow:0 0 0 1px #0000000d,0 1px 2px #0000000a;min-height:88px;transition:transform .18s,box-shadow .18s}
.cc.code:hover,.gs .cc:hover{border:0;transform:translateY(-2px);box-shadow:0 0 0 1.5px #de0702,0 12px 24px #de07021a}
.te button{background:#1b1b1f}
.pen{background:#de0702}
.bn{border:1.5px solid #eccbc8;border-radius:14px}
.pov{background:#0c0c0ecc;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pbox{border-radius:26px;border-top:6px solid #de0702;padding-top:30px}
.pnm{font-weight:600;color:#3a3a40}
.ov{background:#0c0c0e99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.md{border-radius:22px;padding:28px;box-shadow:0 30px 70px #0006}
.md h3{font-size:1.2rem;font-weight:700;color:#121214}
.fld label{font-weight:600;color:#2b2b2f}
.fld input,.fld select,.fld textarea{border-radius:12px;background:#f8f8f9;transition:border-color .2s,box-shadow .2s,background .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#de0702;background:#fff;box-shadow:0 0 0 4px #de070216}
.tt{background:#18181b;border-radius:14px;border-inline-start:4px solid #de0702}
.tt.err{background:#b00602;border-inline-start-color:#fff}
@media(min-width:801px){.side{position:sticky;top:0;height:100vh;overflow-y:auto}}
@media(max-width:800px){
.main{padding:16px}
.uhead{padding:12px 16px}
.ubrand{gap:10px}.ubrand img{height:36px}.ubrand .vr{height:28px}
.uhead h1{font-size:.95rem}
.uhead .btn.gh span{display:none}.uhead .btn.gh{padding:9px 11px}
.uwrap{padding:18px 14px 40px}
.st{padding:16px}.st .si{width:44px;height:44px}.st b{font-size:1.6rem}}

/* ===== Theme toggle + dark mode ===== */
.tg{width:40px;height:40px;border:0;border-radius:11px;background:#ffffff14;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s;flex-shrink:0}
.tg:hover{background:#ffffff26}.tg:focus-visible{outline:3px solid #ffffff88;outline-offset:2px}
.tg svg{width:20px;height:20px}
.uact{display:flex;align-items:center;gap:10px}
.top .tg{margin-inline-start:auto}
.tgi{display:inline-grid;place-items:center}
.tgi .sun,.tgl .ld{display:none}
html[data-theme=dark] .tgi .moon,html[data-theme=dark] .tgl .lm{display:none}
html[data-theme=dark] .tgi .sun{display:block}
html[data-theme=dark] .tgl .ld{display:inline}
.tgi svg{display:block}
html[data-theme=dark]{color-scheme:dark;--card:#161619;--tx:#ececf0;--mut:#9a9aa4;--bd:#2e2e33;--line:#ffffff14}

html[data-theme=dark] .pbox{background:#161619}

html[data-theme=dark] .cc.code:hover,html[data-theme=dark] .gs .cc:hover{box-shadow:0 0 0 1.5px #de0702,0 12px 24px #de07022b}
html[data-theme=dark] .sb:focus-within{box-shadow:0 0 0 4px #de070226}
html[data-theme=dark] .sb input{color:#ececf0}
html[data-theme=dark] .sb .x{background:#2a2a2e;color:#ececf0}
html[data-theme=dark] th{background:#1b1b1f;color:#9a9aa4}
html[data-theme=dark] th,html[data-theme=dark] td{border-bottom-color:#ffffff12}
html[data-theme=dark] tr:hover td{background:#1b1b1f}
html[data-theme=dark] .fo .fi,html[data-theme=dark] .st .si{background:#de07021f}

html[data-theme=dark] .btn.gh:hover{background:#303036}

html[data-theme=dark] .uhead .btn.gh:hover{background:#ffffff26}
html[data-theme=dark] .btn.rd{background:#331a19;color:#eba29d}
html[data-theme=dark] .btn.rd:hover,html[data-theme=dark] .md .btn.rd{background:#de0702;color:#fff}
html[data-theme=dark] .md .btn.rd:hover{background:#b00602}
html[data-theme=dark] .badge.a{background:#12351f;color:#7be0a0}
html[data-theme=dark] .badge.i{background:#331a19;color:#eba29d}
html[data-theme=dark] .fld input,html[data-theme=dark] .fld select,html[data-theme=dark] .fld textarea{background:#1d1d21;border-color:#2e2e33;color:#f0f0f3}

html[data-theme=dark] .fld label{color:#d8d8de}

html[data-theme=dark] .pok{color:#ececf0}
html[data-theme=dark] .ov{background:#000b}
html[data-theme=dark] .uhead::after{background:#de0702}
html[data-theme=dark] .empty{color:#8a8a94}

html[data-theme=dark] .te.sg button{background:#343b4b;box-shadow:0 0 0 1px #ffffff2e}
html[data-theme=dark] .uside .band{box-shadow:0 0 0 1px #4a5266}
html[data-theme=dark] .uside .band.on{box-shadow:none}

/* ===== Etisalat polish: logo tile, red accents, employee view ===== */
:root{--ac:#de0702;--ac2:#b00602;--etr:#de0702}
.ubrand img,.sbrand img,.top img{width:46px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px #ffffff26,0 6px 16px #de070247}
.top img{width:36px;height:36px;border-radius:10px}
.sbrand img{width:50px;height:50px}
.lbrand{background:linear-gradient(155deg,#e60a04 0%,#de0702 45%,#a90400 100%)}
.lbrand img{filter:none;width:min(250px,66%)}
.uhead{background:linear-gradient(90deg,#0c0c0e,#17171b)}
.uhead::after{height:3px;background:linear-gradient(90deg,#de0702,#ff4a43 50%,#de0702)}
.uhead h1{letter-spacing:.2px}
.uside .band{border-radius:14px;transition:transform .15s,box-shadow .15s,background .15s}
.uside .band:hover{transform:translateX(-3px)}
.uside .band.on{background:linear-gradient(135deg,#e30a05,#b40500);box-shadow:0 8px 20px #de070244}
.sb{border-radius:18px}
.sb:focus-within{border-color:#de0702;box-shadow:0 0 0 4px #de070222}
.hero{position:relative;overflow:hidden;border-radius:24px}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;z-index:0;width:380px;height:380px;border-radius:50%;border:1px solid #ffffff2e;top:-190px;inset-inline-start:-120px}
.hero::after{content:"";position:absolute;z-index:0;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,#ffffff22 0,transparent 66%);bottom:-260px;inset-inline-end:-140px}
html:not([data-theme=dark]) .hero{background:linear-gradient(135deg,#e60a04 0%,#c70500 55%,#930300 100%);box-shadow:0 18px 40px #de070233}
.hst>*{background:#ffffff1f;border:1px solid #ffffff2e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;transition:transform .15s,background .15s}
.hst>*:hover{transform:translateY(-3px);background:#ffffff2e}
.hst b{font-size:2.3rem;line-height:1.1;letter-spacing:.5px}
.hst span{margin-top:6px;display:block;font-weight:600;opacity:.95}
.hact button{border:1px solid #ffffff2e;border-radius:99px;background:#ffffff1f}
.hact button:hover{background:#ffffff38;transform:translateY(-1px)}
.hact .rf.new{background:#fff;color:#de0702;box-shadow:0 0 0 4px #ffffff33}
.hero .hmain small{font-size:1rem;font-weight:600}
.hero .hmain h2{text-shadow:0 2px 14px #00000033}
.ccalc{border:1px solid #ffffff2e;background:#00000026;border-radius:18px}
.fo{border-radius:20px}
.fo .fi{background:#de070214;color:#de0702}
.fo:hover{box-shadow:0 0 0 1.5px #de0702,0 16px 30px #de070224}
.fo:hover .fi{background:#de0702;color:#fff}
.bk{border-radius:99px}
.btn{background:linear-gradient(135deg,#e30a05,#c10500);box-shadow:0 4px 12px #de070233}
.btn:hover{background:linear-gradient(135deg,#c10500,#a30400)}
.btn.gh,.btn.rd{box-shadow:none}
.btn.gh{background:#0000000f;color:inherit}
.btn.rd{background:#7a1a17}
html:not([data-theme=dark]) body{background-image:radial-gradient(900px 420px at 100% -120px,#de070214,transparent 70%)}
.side .on,.side a.on{background:linear-gradient(90deg,#de070233,transparent)}
.side a.on{box-shadow:inset 3px 0 0 #de0702}
.tt{border-inline-start-color:#de0702}
@media(max-width:800px){.hst b{font-size:1.9rem}.hero::before{width:260px;height:260px;top:-130px}}

/* ===== v3: login redesign ===== */
.login{background:#0b0b0d}
.login::before{background:radial-gradient(55% 55% at 90% 8%,#de070240 0,transparent 70%),radial-gradient(50% 50% at 8% 95%,#de070230 0,transparent 70%)}
.lc{max-width:1000px;grid-template-columns:1.05fr 1fr;border-radius:30px;box-shadow:0 50px 110px #000c,0 0 0 1px #ffffff1a}
.lbrand{padding:52px 40px;gap:20px;background:linear-gradient(160deg,#ee0b05 0%,#de0702 42%,#a90400 100%)}
.lbrand::before,.lbrand::after{display:none}
.lorb{position:absolute;border-radius:50%;pointer-events:none}
.lorb.o1{width:440px;height:440px;border:1px solid #ffffff30;top:-190px;inset-inline-start:-190px}
.lorb.o2{width:560px;height:560px;background:radial-gradient(circle,#ffffff22 0,transparent 66%);bottom:-300px;inset-inline-end:-220px}
.lbrand img{position:relative;z-index:1;width:min(270px,70%);filter:drop-shadow(0 12px 28px #6a000040);margin-bottom:6px}
.lbrand h2{font-size:1.45rem;letter-spacing:.3px}
.lbrand p{margin:-6px auto 4px;color:#ffe6e4;font-size:1rem}
.lfeat{position:relative;z-index:1;list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:10px;width:100%;max-width:330px;text-align:start}
.lfeat li{display:flex;align-items:center;gap:12px;background:#ffffff1c;border:1px solid #ffffff2b;border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:.9rem;font-weight:600}
.lfeat i{width:34px;height:34px;border-radius:10px;background:#ffffff26;display:grid;place-items:center;flex-shrink:0}
.lfeat svg{width:18px;height:18px}
.lform{padding:44px 46px}
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.lhead h1{margin:0;font-size:1.65rem;line-height:1.25}
.lhead .lsub{margin:2px 0 0;font-size:.92rem}
.lbadge{width:52px;height:52px;border-radius:15px;overflow:hidden;flex-shrink:0;box-shadow:0 8px 20px #de070240}
.lbadge img{width:100%;height:100%;display:block}
.ltabs{border-radius:16px;padding:5px;margin-bottom:28px}
.ltabs button{border-radius:12px;padding:11px 8px;font-size:.96rem}
.ltabs button.on{background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff;box-shadow:0 8px 18px #de070240}
.lw input{padding:15px 46px;border-radius:14px;border-width:1.5px;font-size:1.02rem}
.lf label{font-size:.86rem;letter-spacing:.2px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:15px;font-size:1.05rem;background:linear-gradient(135deg,#ee0b05,#c60500);box-shadow:0 14px 28px #de070247}
.lbtn:hover{background:linear-gradient(135deg,#d90903,#a90400);transform:translateY(-1px)}
.lbtn .arw{width:19px;height:19px;transition:transform .2s}
.lbtn:hover .arw{transform:translateX(-4px)}
.lbtn:disabled{opacity:.7;cursor:wait}
@media(max-width:860px){.lc{grid-template-columns:1fr;max-width:460px}.lbrand{padding:30px 24px 26px;gap:10px}.lbrand img{width:150px}.lbrand h2{font-size:1.15rem}.lbrand p,.lfeat{display:none}.lform{padding:26px 22px 30px}.lhead h1{font-size:1.4rem}.lbadge{width:46px;height:46px}.lorb.o1{width:300px;height:300px}}

/* ===== v3: employee header actions ===== */
.uact{gap:8px}
.hb{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border:1px solid #ffffff1f;border-radius:99px;background:#ffffff12;color:#fff;font-family:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s,border-color .15s}
.hb:hover{background:#ffffff26;border-color:#ffffff40;transform:translateY(-1px)}
.hb:focus-visible{outline:3px solid #ffffff88;outline-offset:2px}
.hb svg{width:19px;height:19px;flex-shrink:0}
.hb .nbd{position:absolute;top:-6px;inset-inline-end:-4px;border:2px solid #0c0c0e}
.hb.rf.new{background:#fff;color:#de0702;border-color:#fff;box-shadow:0 0 0 4px #ffffff30}
.hb.rf.spin svg{animation:rfs .8s linear infinite}
.hb.lo{background:#de070233;border-color:#de070266}
.hb.lo:hover{background:#de0702}
.hb.tgl .ld{display:none}
html[data-theme=dark] .hb.tgl .lm{display:none}html[data-theme=dark] .hb.tgl .ld{display:inline}
@media(max-width:1060px){.hb{width:42px;padding:0;justify-content:center}}
@media(max-width:800px){.uhead{flex-wrap:wrap;gap:12px}.uact{width:100%;justify-content:space-between;order:3}.hb{flex:1;max-width:64px;height:40px}.uhead .umb{order:-1}}

/* ===== v3: hero card + calculator ===== */
.hero{gap:22px;padding:30px 30px 28px}
.hero .hmain h2{font-size:2.3rem}
.hst>*{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 12px 16px}
.hst .hi{width:38px;height:38px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;margin-bottom:6px;font-style:normal}
.hst .hi svg{width:20px;height:20px}
.hst b{font-size:2.1rem}
.ccalc{display:block;max-width:none;width:100%;margin:0;padding:18px;border-radius:22px;background:#ffffff;border:0;box-shadow:0 18px 40px #0000002e;color:#18181b}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cic{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 16px #de070244}
.cic svg{width:22px;height:22px}
.chead b{display:block;font-size:1.05rem;color:#18181b}
.chead small{display:block;font-size:.8rem;color:#6b7280;margin-top:2px;opacity:1}
.crow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.ccalc label{display:block;text-align:start;color:#3a3a40}
.ccalc .cl{display:block;font-size:.8rem;font-weight:700;color:#6b7280;margin-bottom:6px}
.cbox{position:relative}
.ccalc .cin{background:#f3f4f7;border:1.5px solid #e3e5ea;color:#18181b;border-radius:14px;padding:13px 54px 13px 14px;font-size:1.35rem;font-weight:800;text-align:start;direction:ltr;transition:border-color .2s,box-shadow .2s,background .2s}
.ccalc .cin:focus{outline:0;border-color:#de0702;background:#fff;box-shadow:0 0 0 4px #de070222}
.ccalc .cin::placeholder{color:#b4b8c2}
.cbox i{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.76rem;font-weight:700;color:#de0702;background:#de070214;border-radius:99px;padding:3px 9px;pointer-events:none}
.ccalc .ceq{width:40px;height:40px;border-radius:50%;background:#18181b;color:#fff;display:grid;place-items:center;font-size:1.1rem;padding:0;margin-bottom:5px}
.ccalc.off{opacity:.9}.ccalc.off .cin{cursor:not-allowed;opacity:.6}
html[data-theme=dark] .ccalc{background:#1d2129;color:#eceef4;box-shadow:0 18px 40px #0000004d}
html[data-theme=dark] .chead b{color:#eceef4}html[data-theme=dark] .chead small,html[data-theme=dark] .ccalc .cl{color:#a9afbe}
html[data-theme=dark] .ccalc .cin{background:#12151c;border-color:#465066;color:#eceef4}
html[data-theme=dark] .ccalc .cin:focus{background:#171b24}
html[data-theme=dark] .ccalc .ceq{background:#de0702}
@media(max-width:600px){.hero{padding:22px 18px}.crow{grid-template-columns:1fr;gap:8px}.ccalc .ceq{margin:0 auto;transform:rotate(90deg)}.hero .hmain h2{font-size:1.8rem}}

/* v3 fixes */
html:not([data-theme=dark]) .ltabs button.on,html[data-theme=dark] .ltabs button.on{background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff}
html:not([data-theme=dark]) .ltabs button:not(.on):hover{color:#141416}
.ccalc .cin{padding:13px 62px 13px 14px}
.cbox i{inset-inline-end:auto;right:12px;left:auto}
.hb>span:not(.nbd){display:inline}
@media(max-width:1060px){.hb>span:not(.nbd):not(.tgi){display:none}}

.nwt{resize:none!important;max-height:none!important;min-height:100px!important}
.nwin{position:fixed}

/* v15: new logo + image loader */
.boot,html[data-theme=dark] .boot,html:not([data-theme=dark]) .boot{background:#fff!important;color:#8a0300}

.ubrand img,.sbrand img,.top img{border-radius:0!important;box-shadow:none!important;object-fit:contain;filter:drop-shadow(0 4px 10px #de070040)}

.lbadge img{object-fit:contain;filter:drop-shadow(0 4px 10px #de070040)}
.lbrand img{border-radius:0;object-fit:contain}

/* ===== Login / Signup (matches design mockup) ===== */
.lx{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#4a0000;font-family:Inter,"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#141414;direction:ltr}

.lx::before{content:"";position:absolute;inset:-40px;background:var(--plate) center/cover no-repeat;filter:blur(26px) brightness(.72) saturate(1.1)}
.lxs{--W:min(100vw,calc(100vh*1.7768));--W:min(100vw,calc(100dvh*1.7768));--k:calc(var(--W)/1672);position:relative;flex:none;width:var(--W);aspect-ratio:1672/941;background:var(--plate) center/100% 100% no-repeat}
.lxhero,.lxicon{display:none}
.lxform{display:contents}
.lxform>*,.lxtg{position:absolute}
.lxform>*{left:calc(var(--k)*985);width:calc(var(--k)*612);top:calc(var(--k)*var(--t,0))}
/* theme toggle */
.lxtg{left:calc(var(--k)*1480);top:calc(var(--k)*48);width:calc(var(--k)*140);height:calc(var(--k)*52);display:flex;padding:0;border:0;border-radius:999px;overflow:hidden;cursor:pointer;background:linear-gradient(#fff,#efecef);box-shadow:0 calc(var(--k)*3) calc(var(--k)*12) #0000001f,inset 0 calc(var(--k)*1) calc(var(--k)*2) #fff;-webkit-tap-highlight-color:transparent}
.lxtg::before{content:"";position:absolute;left:0;top:0;width:56%;height:100%;border-radius:999px;background:linear-gradient(90deg,#e8110b,#b80000);box-shadow:0 calc(var(--k)*4) calc(var(--k)*10) #c8000a55;transition:left .25s,width .25s}
html[data-theme=dark] .lxtg::before{left:44%}
.lxtg span{position:relative;flex:1;display:grid;place-items:center;color:#5d5d63;transition:color .2s}
.lxtg svg{width:calc(var(--k)*26);height:calc(var(--k)*26)}
.lxtg span:first-child{color:#fff}
html[data-theme=dark] .lxtg span:first-child{color:#5d5d63}

/* titles */
.lxh1{margin:0;text-align:center;font-weight:800;font-size:calc(var(--k)*44);line-height:calc(var(--k)*56)px;height:calc(var(--k)*56);letter-spacing:-.012em;color:#0d0d10}
.lxul{width:calc(var(--k)*278)!important;left:calc(var(--k)*1150)!important;height:calc(var(--k)*17);transform:rotate(-1.2deg)}
.lxsub{margin:0;text-align:center;font-size:calc(var(--k)*23);line-height:calc(var(--k)*36)px;font-weight:500;color:#17171c}
.lxform.su .lxsub{font-size:calc(var(--k)*21);color:#3a3d46}
/* fields */
.lxf{display:flex;align-items:center;height:calc(var(--k)*68);border:calc(var(--k)*1.5) solid #ddd8dc;border-radius:999px;background:linear-gradient(#fff,#f5f2f5);box-shadow:0 calc(var(--k)*3) calc(var(--k)*9) #3a1a2214,inset 0 calc(var(--k)*2) calc(var(--k)*3) #fff;transition:border-color .15s,box-shadow .15s}
.lxform.su .lxf{height:calc(var(--k)*62)}
.lxf:focus-within{border-color:#e30613;box-shadow:0 0 0 calc(var(--k)*4) #e3061326,0 calc(var(--k)*3) calc(var(--k)*9) #3a1a2214}

.lxeye{position:absolute;right:calc(var(--k)*22);top:50%;width:calc(var(--k)*40);height:calc(var(--k)*40);margin-top:calc(var(--k)*-20);display:grid;place-items:center;border:0;background:none;color:#2a2a30;cursor:pointer;padding:0}

/* remember / forgot */
.lxrow{left:calc(var(--k)*988)!important;width:calc(var(--k)*608)!important;display:flex;align-items:center;justify-content:space-between;height:calc(var(--k)*32)}
.lxrem{display:flex;align-items:center;gap:calc(var(--k)*12);cursor:pointer;user-select:none;font-size:calc(var(--k)*20);font-weight:500;color:#1b1b20;white-space:nowrap}

.lxrem input{appearance:none;-webkit-appearance:none;flex:none;width:calc(var(--k)*28);height:calc(var(--k)*28);margin:0;border:calc(var(--k)*1.5) solid #cfc8cd;border-radius:calc(var(--k)*7);background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}

.lxfp{display:flex;align-items:center;gap:calc(var(--k)*9);padding:0;border:0;background:none;cursor:pointer;color:#d40000;font:600 max(12px,calc(var(--k)*16)) Inter,"Segoe UI",sans-serif;white-space:nowrap}

/* primary button */
.lxbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*52);width:100%;height:calc(var(--k)*68);border:0;border-radius:999px;background:linear-gradient(90deg,#e30613,#b40000);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 calc(var(--k)*9) calc(var(--k)*18) #c8000a47,inset 0 calc(var(--k)*2) calc(var(--k)*3) #ffffff55;transition:filter .15s,transform .1s}

.lxform.su>.lxbtn{height:calc(var(--k)*64)}
.lxbtn:hover{filter:brightness(1.07)}.lxbtn:active{transform:translateY(1px)}.lxbtn:disabled{opacity:.65;cursor:default}
.lxbtn .tx{display:flex;align-items:center;gap:calc(var(--k)*26);font-size:calc(var(--k)*27);font-weight:700}
.lxbtn .tx em{font-style:normal;font-weight:500;font-size:calc(var(--k)*23);font-family:"IBM Plex Sans Arabic",Cairo,sans-serif}
.lxbtn .go{flex:none;width:calc(var(--k)*36);height:calc(var(--k)*36);border-radius:50%;background:#fff;color:#d40000;display:grid;place-items:center;box-shadow:0 calc(var(--k)*2) calc(var(--k)*5) #0003}
.lxbtn .go svg{width:calc(var(--k)*20);height:calc(var(--k)*20)}
/* or + alt */
.lxor{display:flex;align-items:center;gap:calc(var(--k)*52);height:calc(var(--k)*24);font-size:calc(var(--k)*18);color:#3a3d46;left:calc(var(--k)*988)!important;width:calc(var(--k)*607)!important}
.lxor::before,.lxor::after{content:"";flex:1;height:1px;background:#d9d3d8}
.lxalt{display:flex;align-items:center;gap:calc(var(--k)*12);left:calc(var(--k)*1090)!important;width:calc(var(--k)*410)!important;height:calc(var(--k)*55);padding:0 calc(var(--k)*30) 0 calc(var(--k)*28);border:calc(var(--k)*1.6) solid #2a2a2f;border-radius:999px;background:#ffffff80;color:#17171c;cursor:pointer;font-family:inherit;transition:background .15s}

tr[data-lrow]{cursor:grab;-webkit-user-select:none;user-select:none}
body.dragmode tr[data-lrow]{cursor:grabbing}
.dgp{display:inline-grid;place-items:center;width:30px;height:30px;color:#9a9aa4;border-radius:9px;transition:background .15s,color .15s}
tr[data-lrow]:hover .dgp{color:#de0702;background:#de07021a}

/* ===== v22: search bar sits inside the red hero card (home only) ===== */
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{position:relative;z-index:3;height:54px;margin:0 18px -54px;padding-block:0;transform:translateY(18px);border-color:transparent;box-shadow:0 12px 26px -8px #0000006b}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input{height:100%;padding-block:0}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) #ubody>.hero.h2{padding-top:90px}
@media(max-width:700px){html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{margin-inline:10px}}

/* ===== v23: seamless robot image + glass search inside hero ===== */
html[data-theme] body:has(.ushell) .hero.h2 .hbn .rob{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent),linear-gradient(180deg,transparent 0,#000 36px);mask-image:linear-gradient(90deg,#000 70%,transparent),linear-gradient(180deg,transparent 0,#000 36px);-webkit-mask-composite:source-in;mask-composite:intersect}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) #ubody>.hero.h2{padding-top:84px}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{height:52px;margin:0 16px -52px;transform:translateY(16px);background:#ffffff26;border:1px solid #ffffff52;border-radius:16px;box-shadow:inset 0 1px 0 #ffffff40,0 12px 26px -12px #0000008c;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;transition:background .18s,border-color .18s,box-shadow .18s}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:hover{background:#ffffff33}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb .sbi{color:#fff}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input{color:#fff;caret-color:#fff;font-weight:600}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input::placeholder{color:#ffe9e6;opacity:.82;font-weight:500}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb .x{background:#ffffff38;color:#fff}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within{background:#fff;border-color:#fff;box-shadow:0 0 0 4px #ffffff40,0 14px 30px -12px #0009}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within .sbi{color:#de0702}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within input{color:#17181d;caret-color:#de0702}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within input::placeholder{color:#8a8f9c}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within .x{background:#eceef3;color:#444}
@media(max-width:700px){html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{margin-inline:10px}}

/* ===== v24: no page scroll on employee view - only the list area scrolls ===== */
html[data-theme] body:has(.ushell){height:100vh;height:100dvh;overflow:hidden}
html[data-theme] body:has(.ushell) #app{height:100vh;height:100dvh;display:flex;flex-direction:column}
html[data-theme] body:has(.ushell) .uhead{flex:none}
html[data-theme] body:has(.ushell) .ushell{display:flex;flex:1 1 0;min-height:0;width:100%;align-items:stretch}

/* 3-way merge: يطبق تعديلاتي (mine مقابل base) فوق آخر نسخة على السيرفر (theirs) */
function merge(base,mine,theirs){

 const B=ix(base),M=ix(mine),out=JSON.parse(js(theirs)),O=ix(out);
 for(const [id,mc] of M){const bc=B.get(id);
  if(!O.has(id)){if(!bc){const c=JSON.parse(js(mc));out.push(c);O.set(id,c)}continue}
  const oc=O.get(id);
  if(!bc||mc.name!==bc.name||mc.description!==bc.description){oc.name=mc.name;oc.description=mc.description}
  const BC=ix(bc?bc.codes:[]),OC=ix(oc.codes);

  oc.codes=oc.codes.filter(k=>!(BC.has(k.id)&&!mk.has(k.id)))}
 for(const id of B.keys())if(!M.has(id)){const i=out.findIndex(c=>c.id===id);if(i>=0)out.splice(i,1)}
 return out}
function mergeLog(base,mine,theirs){const mi=new Set(mine.map(e=>e.id)),bi=new Set(base.map(e=>e.id)),ti=new Set(theirs.map(e=>e.id));

 const q=Object.keys(f).map(k=>"updateMask.fieldPaths="+k).join("&")+(pre?(ut?"&currentDocument.updateTime="+encodeURIComponent(ut):"&currentDocument.exists=false"):"");
 const r=await fetch(DOCS+n+"?key="+FB.apiKey+"&"+q,{method:"PATCH",headers:{Authorization:"Bearer "+idt,"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
 const j=await r.json().catch(()=>({}));
 if(r.ok)return{ut:j.updateTime};
 if(pre&&(r.status===409||/FAILED_PRECONDITION|ABORTED|ALREADY_EXISTS/.test(JSON.stringify(j))))return{conflict:true};
 throw j}

 if(cT!==rem.c.t){
  const r=await putDoc("main",{json:{stringValue:cT}},idt,rem.c.ut,true);
  if(r.conflict){
   const f=await fetchRemote(true);if(!f)throw{message:"تعذر الاتصال بالإنترنت"};
   let base=[],bl=[];try{const bj=JSON.parse(rem.c.t||"{}");base=bj.categories||[];bl=bj.log||[]}catch(e){}
   {const bi=base.map(c=>c.id),mi=S.categories.map(c=>c.id),out=merge(base,S.categories,f.cats||[]);
    if(JSON.stringify(bi.filter(x=>mi.includes(x)))!==JSON.stringify(mi.filter(x=>bi.includes(x)))){const pos=new Map(mi.map((x,i)=>[x,i]));out.sort((a,b)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(b.id)?pos.get(b.id):1e9))}
    out.forEach(oc=>{const mc=S.categories.find(c=>c.id===oc.id),bc=base.find(c=>c.id===oc.id);if(!mc||!bc)return;const bi2=bc.codes.map(k=>k.id),mi2=mc.codes.map(k=>k.id);if(JSON.stringify(bi2.filter(x=>mi2.includes(x)))!==JSON.stringify(mi2.filter(x=>bi2.includes(x)))){const ps=new Map(mi2.map((x,i)=>[x,i]));oc.codes.sort((a,b)=>(ps.has(a.id)?ps.get(a.id):1e9)-(ps.has(b.id)?ps.get(b.id):1e9))}});

/* ===== Signup requests (Firestore collection "signups", doc id = hex(username)) ===== */
const SIGN="https://firestore.googleapis.com/v1/projects/"+FB.projectId+"/databases/(default)/documents/signups";
const rid=u=>"u_"+hex(new TextEncoder().encode(norm(u)));
const fv=(f,k)=>(f&&f[k]&&f[k].stringValue)||"";
const reqObj=(id,f)=>({id:id,name:fv(f,"name"),username:fv(f,"username"),salt:fv(f,"salt"),hash:fv(f,"hash"),phone:fv(f,"phone"),status:fv(f,"status")||"pending",created:fv(f,"created")});
async function getReq(un){try{const r=await fetch(SIGN+"/"+rid(un)+"?key="+FB.apiKey,{cache:"no-store"});
 if(r.status===404)return{state:"none"};if(r.status===403)return{state:"deny"};if(!r.ok)return{state:"err"};
 const j=await r.json();return{state:"ok",d:reqObj(rid(un),j.fields)}}catch(e){return{state:"err"}}}
async function createReq(o){try{const f={};["name","username","salt","hash","phone"].forEach(k=>f[k]={stringValue:String(o[k]||"")});
 f.status={stringValue:"pending"};f.created={stringValue:new Date().toISOString()+(o.mark?"~"+o.mark:"")};
 const r=await fetch(SIGN+"?documentId="+rid(o.username)+"&key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
 if(r.ok)return"ok";if(r.status===409)return"taken";if(r.status===403)return"deny";return"err"}catch(e){return"err"}}
async function refreshUsers(){try{const r=await fetchRemote();if(r&&r.cats&&!S._dirty){setRem(r);S=fromRemote(r);await migrate(S);save(true)}}catch(e){}}
let REQ={list:[],err:"",ok:false};
async function loadReqs(){if(!isAdm()||!tok)return;let nx;
 try{const idt=await fbToken();const r=await fetch(SIGN+"?pageSize=300",{headers:{Authorization:"Bearer "+idt},cache:"no-store"});
  if(r.ok){const j=await r.json();nx={list:(j.documents||[]).map(d=>reqObj(d.name.split("/").pop(),d.fields)).sort((a,b)=>String(b.created).localeCompare(String(a.created))),err:"",ok:true}}
  else nx={list:REQ.list,err:r.status===403?"rules":"net",ok:false}}
 catch(e){nx={list:REQ.list,err:"net",ok:false}}
 const ch=JSON.stringify(nx)!==JSON.stringify(REQ);REQ=nx;if(isAdm()&&nx.ok&&await autoImport()){render();return}if(ch&&isAdm()&&!$("#modal").innerHTML)render()}
let impBusy=false;
async function autoImport(){if(impBusy||!isAdm())return false;const L=REQ.list.filter(q=>q.status!=="approved"&&/^[0-9a-f]{64}$/.test(q.hash)&&q.salt);if(!L.length)return false;impBusy=true;const done=[];
 try{for(const q of L){if(norm(q.username)==="admin"||S.users.some(x=>norm(x.username)===norm(q.username))){done.push(q);continue}
   S.users.push({id:uid(),name:q.name,username:q.username,status:q.status==="rejected"?"inactive":"active",phone:q.phone||"",salt:q.salt,hash:q.hash});done.push(q)}
  save();await pushRemote();
  for(const q of done){try{if(!S._dirty)await reqDel(q.id);else await reqPatch(q.id,"approved")}catch(e){console.error(e)}}
  REQ.list=REQ.list.filter(x=>!done.includes(x))}catch(e){console.error(e)}
 impBusy=false;return done.length>0}
async function reqPatch(id,st){const idt=await fbToken();const r=await fetch(SIGN+"/"+id+"?updateMask.fieldPaths=status&key="+FB.apiKey,{method:"PATCH",headers:{Authorization:"Bearer "+idt,"Content-Type":"application/json"},body:JSON.stringify({fields:{status:{stringValue:st}}})});if(!r.ok)throw{message:"PERMISSION_DENIED"}}
async function reqDel(id){const idt=await fbToken();const r=await fetch(SIGN+"/"+id+"?key="+FB.apiKey,{method:"DELETE",headers:{Authorization:"Bearer "+idt}});if(!r.ok&&r.status!==404)throw{message:"PERMISSION_DENIED"}}
const cleanPh=s=>cNorm(s).replace(/[\s\-()]/g,""),okPh=s=>/^\+?\d{8,15}$/.test(s);

 const r=await fetch(PHU+"?documentId="+encodeURIComponent(o.id)+"&key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})});

async function phDel(id){const idt=await fbToken();const r=await fetch(PHU+"/"+id+"?key="+FB.apiKey,{method:"DELETE",headers:{Authorization:"Bearer "+idt}});if(!r.ok&&r.status!==404)throw{message:"PERMISSION_DENIED"}}
async function loadPh(){if(!isAdm()||!tok)return;let nx;
 try{const idt=await fbToken();const r=await fetch(PHU+"?pageSize=300",{headers:{Authorization:"Bearer "+idt},cache:"no-store"});
  if(r.ok){const j=await r.json();nx={list:(j.documents||[]).map(d=>phObj(d.name.split("/").pop(),d.fields)).sort((a,b)=>String(b.created).localeCompare(String(a.created))),err:"",ok:true}}
  else nx={list:PH.list,err:r.status===403?"rules":"net",ok:false}}
 catch(e){nx={list:PH.list,err:"net",ok:false}}

 return`<div class="hd"><h2>Phone Updates <span class="badge w">${PH.list.length}</span></h2><button class="btn gh" data-act="phref">⟳ Refresh</button></div><div class="tw" style="margin-bottom:18px"><table><tr><th>Name</th><th>Username</th><th>Phone</th><th>Date</th><th>Actions</th></tr>${PH.list.map(q=>`<tr><td>${esc(q.name)}</td><td class="ltr">${esc(q.username)}</td><td class="ltr">${esc(q.phone)}</td><td class="ltr">${esc((q.created||"").slice(0,10))}</td><td><button class="btn sm" data-act="phok" data-id="${q.id}">Apply</button><button class="btn rd sm" data-act="phno" data-id="${q.id}">Reject</button></td></tr>`).join("")}</table></div>`}

 try{await flushCDel();const idt=await fbToken();const r=await fetch(CRQ+"?pageSize=300",{headers:{Authorization:"Bearer "+idt},cache:"no-store"});
  if(r.ok){const j=await r.json();nx={list:(j.documents||[]).map(d=>creqObj(d.name.split("/").pop(),d.fields)).filter(x=>!cdel.has(x.id)).sort((a,b)=>String(b.created).localeCompare(String(a.created))),err:"",ok:true}}
  else nx={list:CREQ.list,err:r.status===403?"rules":"net",ok:false}}
 catch(e){nx={list:CREQ.list,err:"net",ok:false}}

function rulesCard(){const em=tok&&tok.email?tok.email:"ADMIN_EMAIL";
 const r="match /signups/{id} {\n  allow get: if true;\n  allow create: if request.resource.data.status == 'pending'\n    && request.resource.data.keys().hasOnly(['name','username','phone','salt','hash','status','created'])\n    && request.resource.data.name is string && request.resource.data.name.size() < 80\n    && request.resource.data.username is string && request.resource.data.username.size() < 40;\n  allow list, update, delete: if request.auth != null && request.auth.token.email == '"+em+"';\n}\n\nmatch /codereqs/{id} {\n  allow create: if request.resource.data.status == 'pending'\n    && request.resource.data.keys().hasOnly(['type','name','shortCode','description','by','uid','targetId','oldName','oldCode','catName','status','created'])\n    && request.resource.data.type in ['add','edit']\n    && request.resource.data.name is string && request.resource.data.name.size() < 100\n    && request.resource.data.shortCode is string && request.resource.data.shortCode.size() < 200\n    && request.resource.data.description is string && request.resource.data.description.size() < 300\n    && request.resource.data.by is string && request.resource.data.by.size() < 80;\n  allow get, list, update, delete: if request.auth != null && request.auth.token.email == '"+em+"';\n}\n\nmatch /phoneupd/{id} {\n  allow create: if request.resource.data.keys().hasOnly(['name','username','phone','created'])\n    && request.resource.data.phone is string && request.resource.data.phone.size() < 25\n    && request.resource.data.name is string && request.resource.data.name.size() < 80\n    && request.resource.data.username is string && request.resource.data.username.size() < 40;\n  allow get, list, update, delete: if request.auth != null && request.auth.token.email == '"+em+"';\n}\n\nmatch /notes/{id} {\n  allow get: if true;\n  allow create, update: if request.resource.data.keys().hasOnly(['text','t','by'])\n    && request.resource.data.text is string && request.resource.data.text.size() <= 20000\n    && request.resource.data.t is int\n    && request.resource.data.by is string && request.resource.data.by.size() < 80;\n  allow list, delete: if request.auth != null && request.auth.token.email == '"+em+"';\n}";
 return`<div class="card" style="max-width:760px"><h3>Signup Rules</h3><p style="margin-bottom:12px;color:var(--mut);line-height:1.9;font-size:.9rem">عشان إنشاء الحساب واقتراحات الأكواد من الموظفين يشتغلوا، افتح Firebase Console ← Firestore Database ← Rules، والصق القواعد دي (لو القواعد موجودة قبل كده، استبدل قاعدة signups بالجديدة — فيها حقل phone — وضيف قاعدة phoneupd) جوه <b class="ltr">match /databases/{database}/documents</b> جنب القواعد الحالية، وبعدها Publish. مرة واحدة بس.</p><pre class="rules" id="rulesTx">${esc(r)}</pre><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn gh" data-act="copyrules">Copy Rules</button></div></div>`}

  u.phone=q.phone;PH.list=PH.list.filter(x=>x.id!==id);ok();toast("تم تحديث رقم "+u.name);phDel(id).catch(e=>console.error(e));break}
 case"phno":{PH.list=PH.list.filter(x=>x.id!==id);render();phDel(id).catch(e=>console.error(e));break}
 case"phupd":{const u=needPh();if(!u)break;
  formModal("تحديث بيانات الحساب",'<p style="margin-bottom:10px;color:var(--mut);font-size:.9rem;line-height:1.7">اكتب رقم تليفونك واسم المستخدم وكلمة المرور للتأكيد.</p>'+inp("Phone Number","phone","","tel",1)+inp("Username","username","","text",1)+inp("Password","password","","password",1),"إرسال",async d=>{

   if(r==="err")return"تعذر الإرسال. تأكد من الاتصال وحاول مرة أخرى.";

   toast("تم الإرسال للأدمن، شكرًا");render()});break}
