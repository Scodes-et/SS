<!DOCTYPE html>
<html lang="ar" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>3aref - Knowledge Hub</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("aref_theme")==="dark"?"dark":"light"}catch(e){}</script>
<style>
:root{--ac:#de0702;--bg:#eceef2;--card:#fff;--c2:#f5f6f9;--tx:#12141a;--mut:#5d6473;--bd:#dde1e9;--side:#fff;--sh:0 6px 18px -8px #10182820}
html[data-theme=dark]{--bg:#0e1118;--card:#1a1e29;--c2:#222735;--tx:#eceef4;--mut:#a9afbe;--bd:#333a4b;--side:#161a24;--sh:0 6px 18px -8px #0008}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hd{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(100deg,#8f0006,#cf000d 40%,#e5121a 65%,#a30008);color:#fff;box-shadow:0 10px 26px -10px #8a000a99}
.hd img{height:38px}.hd .vr{width:1.5px;height:30px;background:#fff6}.hd .t{font-size:1.05rem;white-space:nowrap}.hd .t b{font-weight:800;margin-inline-end:8px}.sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:#ffffff1f;color:#fff;display:grid;place-items:center}.ib:hover{background:#ffffff3a}
.av{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(#ffe2e4,#ffc2c6);color:#c4000d;font-weight:800}
.am{display:none;position:fixed;right:12px;top:66px;min-width:220px;padding:10px;border-radius:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:0 18px 40px #0004;z-index:200}.am.on{display:block}
.am .n{padding:8px 10px 10px;border-bottom:1px solid var(--bd);margin-bottom:6px}.am small{color:var(--mut);display:block}
.am button{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border:0;background:none;border-radius:10px;font-weight:600}.am button:hover{background:#de070214}.am svg{color:var(--ac)}
.shell{display:flex;align-items:flex-start;max-width:1500px;margin:auto}
.side{width:290px;flex:none;position:sticky;top:60px;height:calc(100vh - 60px);overflow:auto;background:var(--side);border-inline-end:1px solid var(--bd);padding:12px}
.side .sr{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit;margin-bottom:10px}
.tp{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:none;text-align:start;font-weight:600;margin-bottom:2px}
.tp svg{color:var(--ac);flex:none}.tp span{flex:1;overflow-wrap:anywhere}.tp em{font-style:normal;font-size:.8rem;background:var(--c2);border-radius:99px;padding:3px 10px;color:var(--mut)}
.tp:hover,.tp.on{background:#de07021a}.tp.on{box-shadow:inset 3px 0 0 var(--ac)}
.main{flex:1;min-width:0;padding:20px}
.pg{max-width:900px;margin:auto}h2.ttl{margin:0 0 4px;font-size:1.6rem}.sub{color:var(--mut);margin-bottom:18px}
.hero{background:linear-gradient(120deg,#8f0006,#de0702);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);position:relative;overflow-wrap:anywhere}
.cd h4{margin:0 0 8px;color:var(--ac);font-size:1.02rem}.cd .tx,.bk .tx{line-height:1.8;white-space:pre-wrap}
.bk{position:relative;margin-bottom:14px}.bk>h3{margin:0 0 8px;font-size:1.15rem}
.note{border-inline-start:4px solid var(--ac);background:#de07021a;border-radius:12px;padding:12px 14px}
.txt{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:420px}
th{background:var(--ac);color:#fff;padding:10px 12px;text-align:start}td{padding:10px 12px;border-top:1px solid var(--bd);vertical-align:top}tbody tr:nth-child(even){background:var(--c2)}
ul.ls{margin:0;padding-inline-start:22px;line-height:1.9}
.tools{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:4px;z-index:2}.tools button{border:1px solid var(--bd);background:var(--card);border-radius:8px;width:30px;height:30px;display:grid;place-items:center}.tools svg{width:15px;height:15px}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700}.btn.g{background:var(--c2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#8f0401}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.empty{text-align:center;color:var(--mut);padding:40px}
.ov{position:fixed;inset:0;background:#000a;z-index:300;display:grid;place-items:center;padding:14px}.md{background:var(--card);border-radius:18px;padding:18px;width:min(560px,100%);max-height:92vh;overflow:auto}
.md h3{margin:0 0 12px}.md label{display:block;font-weight:600;margin:10px 0 4px;font-size:.9rem}.md input,.md textarea,.md select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit}.md textarea{min-height:150px}.md .h{color:var(--mut);font-size:.8rem;margin-top:4px}.md .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.lg{min-height:100vh;display:grid;place-items:center;padding:16px}.lc{width:min(400px,100%);background:var(--card);border-radius:22px;padding:26px;box-shadow:0 30px 60px -20px #0006;text-align:center}.lc img{height:54px;margin-bottom:6px}.lc input{width:100%;padding:12px;margin-top:10px;border-radius:12px;border:1px solid var(--bd);background:var(--c2);color:var(--tx);font:inherit}.lc .btn{width:100%;margin-top:14px}.er{color:#c00;min-height:20px;margin-top:8px;font-size:.9rem}
.tg{position:fixed;bottom:16px;inset-inline-end:16px;z-index:30;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);font-size:.8rem;color:var(--mut)}
.fo{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:18px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);text-align:start;cursor:pointer;transition:.15s}.fo:hover{transform:translateY(-2px);border-color:var(--c)}
.fo i{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--cb);color:var(--c)}.fo b{font-size:1.02rem;overflow-wrap:anywhere}.fo em{font-style:normal;color:var(--mut);font-size:.82rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}.st b{display:block;font-size:1.9rem;color:var(--ac)}.st span{color:var(--mut)}
.brw{display:flex;align-items:center;gap:10px;margin-top:10px}.brw span{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.brw div{flex:1;height:10px;border-radius:9px;background:var(--c2)}.brw i{display:block;height:100%;border-radius:9px;background:var(--c)}
.mini{border:1px solid var(--bd);background:var(--c2);border-radius:8px;width:30px;height:30px;margin-inline-end:4px}.btn.sm{padding:6px 12px}
.side{display:flex;flex-direction:column}.side .tp{flex:none}
.mb{display:none}.scrim{display:none}
@media(max-width:800px){.mb{display:grid}.hd .t span{display:none}.side{position:fixed;z-index:120;top:0;height:100vh;inset-inline-start:0;transform:translateX(-105%);transition:.25s;padding-top:70px}html[dir=rtl] .side{transform:translateX(105%)}.side.on{transform:none!important}.scrim.on{display:block;position:fixed;inset:0;background:#0008;z-index:110}.shell{display:block}}

async function load(){try{const r=await fetch(DOCS+"aref?key="+FB.apiKey,{cache:"no-store"});if(r.status===404){ut=null;return}
 if(!r.ok)throw 0;const j=await r.json();ut=j.updateTime;const t=j.fields&&j.fields.json&&j.fields.json.stringValue;if(t){const d=JSON.parse(t);if(Array.isArray(d.topics))S=d;try{localStorage.setItem("aref_cache",t)}catch(e){}}}
 catch(e){try{const c=localStorage.getItem("aref_cache");if(c)S=JSON.parse(c)}catch(x){}}}
async function token(){if(tok&&Date.now()<tok.exp)return tok.id;
 const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(tok.ref)});
 const d=await r.json();if(!r.ok)throw d;tok.id=d.id_token;tok.ref=d.refresh_token;tok.exp=Date.now()+(+d.expires_in-60)*1000;return tok.id}
function save(){clearTimeout(timer);flag("Saving...");timer=setTimeout(push,700)}
async function push(){try{const idt=await token(),f={json:{stringValue:JSON.stringify(S)},updated:{stringValue:new Date().toISOString()}};
 const r=await fetch(DOCS+"aref?key="+FB.apiKey+"&updateMask.fieldPaths=json&updateMask.fieldPaths=updated",{method:"PATCH",headers:{Authorization:"Bearer "+idt,"Content-Type":"application/json"},body:JSON.stringify({fields:f})});
 if(!r.ok){const j=await r.json().catch(()=>({}));throw j}flag("Saved ✓",1500)}
 catch(e){const m=JSON.stringify(e);flag(/PERMISSION/.test(m)?"No write permission - check Firestore Rules":"Save failed",6000)}}
function flag(t,ms){const e=$("#tg");e.textContent=t;e.hidden=false;if(ms)setTimeout(()=>e.hidden=true,ms)}
/* ---- auth ---- */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
async function H(salt,pw){const en=new TextEncoder(),k=await crypto.subtle.importKey("raw",en.encode(String(pw)),"PBKDF2",false,["deriveBits"]);return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:en.encode(String(salt)),iterations:100000},k,256))}
async function users(){const g=async n=>{const r=await fetch(DOCS+n+"?key="+FB.apiKey,{cache:"no-store"});if(!r.ok)return null;return(await r.json()).fields||{}};
 const [u,p]=await Promise.all([g("users"),g("phones")]);if(!u)throw 0;let L=JSON.parse(u.json.stringValue).users||[];const m=(p&&p.map&&p.map.mapValue&&p.map.mapValue.fields)||{};
 return L.map(x=>{if(!(x.id in m))return x;let o={};try{o=JSON.parse(m[x.id].stringValue)}catch(e){}const n={};["name","username","salt","hash"].forEach(k=>{if(typeof o[k]==="string")n[k]=o[k]});return Object.assign({},x,n)})}
async function login(){const un=$("#u").value.trim(),pw=$("#p").value,er=$("#er");er.textContent="Verifying...";
 try{if(un.includes("@")){const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+FB.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:un,password:pw,returnSecureToken:true})});
  const d=await r.json();if(!r.ok){er.textContent="Wrong email or password";return}
  tok={id:d.idToken,ref:d.refreshToken,exp:Date.now()+(+d.expiresIn-60)*1000};ses={role:"admin",name:un};
  try{localStorage.setItem("aref_ses",JSON.stringify({role:"admin",name:un,ref:d.refreshToken}))}catch(e){}}
 else{const L=await users(),x=L.find(v=>String(v.username||"").trim().toLowerCase()===un.toLowerCase());
  if(!x||await H(x.salt,pw)!==x.hash){er.textContent="Wrong username or password";return}
  if(x.status!=="active"){er.textContent="Account not active. Contact the admin.";return}
  ses={role:"user",name:x.name};try{localStorage.setItem("aref_ses",JSON.stringify({role:"user",name:x.name}))}catch(e){}}
 cur=null;render()}catch(e){er.textContent="Could not verify. Check your connection."}}
function logout(){ses=tok=null;ed=false;try{localStorage.removeItem("aref_ses")}catch(e){}render()}

 return`<div class="hd"><button class="ib mb" id="mb">${I.menu}</button><img src="${LOGO}" alt=""><span class="vr"></span><div class="t"><b>3aref</b><span>${sub}</span></div><div class="sp"></div>${extra||""}<button class="ib" id="th">${dk?I.sun:I.moon}</button><button class="av" id="av">${esc(ini)}</button><div class="am" id="am"><div class="n"><b>${esc(ses.name)}</b><small>${isA()?"Admin":"Employee"}</small></div><button id="lo">${I.out}<span>Logout</span></button></div></div><div class="scrim" id="sc"></div>`}
function render(){const a=$("#app");
 if(!ses){a.innerHTML=`<div class="lg"><div class="lc"><img src="${LOGO}" alt=""><h2 style="margin:6px 0 2px">3aref</h2><div style="color:var(--mut)">Knowledge Hub - Sign in</div><input id="u" placeholder="Username (admin: email)" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><div class="er" id="er"></div><button class="btn" id="go">Login</button></div></div>`;
  $("#go").onclick=login;$("#p").onkeydown=e=>{if(e.key==="Enter")login()};return}
 if(isA()&&pg!=="view"){if(pg==="folder"&&!T())pg="folders";ed=pg==="folder";return adm()}
 ed=false;emp()}
function adm(){const nav=[["dash",IC.home,"Dashboard"],["folders",I.list,"Folders"],["view",IC.eye,"Employee View"]];
 $("#app").innerHTML=head("Admin Panel")+`<div class="shell"><aside class="side" id="sd">${nav.map(n=>`<button class="tp${pg===n[0]||(pg==="folder"&&n[0]==="folders")?" on":""}" data-pg="${n[0]}">${n[1]}<span>${n[2]}</span></button>`).join("")}</aside><main class="main"><div class="pg" id="pg">${apage()}</div></main></div>`;bind()}
function apage(){const F=S.topics,B=F.flatMap(f=>f.blocks),c=t=>B.filter(b=>b.t===t).length;
 if(pg==="dash"){const mx=Math.max(1,...F.map(f=>f.blocks.length));
  return`<div class="hero"><h2>Admin Panel</h2><p>Manage folders, tables, cards and lists</p></div><div class="stats">${[["Folders",F.length],["Blocks",B.length],["Tables",c("table")],["Cards",c("card")]].map(s=>`<div class="st"><b>${s[1]}</b><span>${s[0]}</span></div>`).join("")}</div><div class="cd"><h4>Blocks per folder</h4>${F.map(f=>`<div class="brw" style="${fcol(f.id)}"><span dir="auto">${esc(f.name)}</span><div><i style="width:${Math.max(4,f.blocks.length/mx*100)}%"></i></div><b>${f.blocks.length}</b></div>`).join("")||'<div class="empty">No folders yet</div>'}</div>`}
 if(pg==="folders")return`<div class="bar" style="justify-content:space-between;align-items:center"><h2 class="ttl" style="margin:0">Folders</h2><button class="btn" id="nt">+ Add Folder</button></div><div class="tw"><table><thead><tr><th>Order</th><th>Folder Name</th><th>Description</th><th>Items</th><th>Actions</th></tr></thead><tbody>${F.map(f=>`<tr><td style="white-space:nowrap"><button class="mini" data-fm="up" data-id="${f.id}">▲</button><button class="mini" data-fm="dn" data-id="${f.id}">▼</button></td><td dir="auto">${esc(f.name)}</td><td dir="auto">${esc(f.desc||"")}</td><td>${f.blocks.length}</td><td style="white-space:nowrap"><button class="btn sm" data-t="${f.id}">Open</button> <button class="btn g sm" data-fe="${f.id}">Edit</button> <button class="btn d sm" data-fd="${f.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No folders yet. Add your first one.</td></tr>'}</tbody></table></div>`;
 return`<button class="btn g sm" data-pg="folders">← Folders</button><div style="height:12px"></div>`+page()}
function emp(){$("#app").innerHTML=head("Knowledge Hub",isA()?`<button class="ib" id="bk" title="Back to admin">${IC.home}</button>`:"")+`<div class="shell"><aside class="side" id="sd"><input class="sr" id="q" placeholder="Search folders and content..." value="${esc(q)}">${side()}</aside><main class="main"><div class="pg" id="pg">${page()}</div></main></div>`;bind()}
const flt=()=>{const f=q.trim().toLowerCase();return f?S.topics.filter(t=>t.name.toLowerCase().includes(f)||JSON.stringify(t.blocks).toLowerCase().includes(f)):S.topics};
function side(){return flt().map(t=>`<button class="tp${t.id===cur?" on":""}" data-t="${t.id}">${I.list}<span dir="auto">${esc(t.name)}</span><em>${t.blocks.length}</em></button>`).join("")||'<div class="empty">No folders</div>'}
function page(){const t=T();
 if(!t)return`<div class="hero"><h2>Welcome, ${esc(ses.name)} 👋</h2><p>Pick a folder to see explanations, packages and tables.</p></div>${flt().length?`<div class="grid">${flt().map(x=>`<button class="fo" style="${fcol(x.id)}" data-t="${x.id}"><i>${I.list}</i><b dir="auto">${esc(x.name)}</b><em>${x.blocks.length} items</em></button>`).join("")}</div>`:'<div class="empty">No content yet.</div>'}`;
 const bl=t.blocks,out=[];let i=0;
 while(i<bl.length){const b=bl[i];if(b.t==="card"){const g=[];while(i<bl.length&&bl[i].t==="card")g.push(bl[i++]);out.push(`<div class="grid">${g.map(blk).join("")}</div>`)}else{out.push(blk(b));i++}}
 return`${!ed&&!isA()?`<button class="btn g sm" data-pg="home">← All folders</button><div style="height:10px"></div>`:""}<h2 class="ttl" dir="auto">${esc(t.name)}</h2><div class="sub" dir="auto">${esc(t.desc||"")}</div>${ed?`<div class="bar"><button class="btn" id="ab">+ Add block</button><button class="btn g" id="et">Edit folder</button><button class="btn d" id="dt">Delete folder</button></div>`:""}${out.join("")||'<div class="empty">Empty folder</div>'}`}
function blk(b){const tl=ed?`<div class="tools"><button data-m="up" data-b="${b.id}">${I.up}</button><button data-m="dn" data-b="${b.id}">${I.dn}</button><button data-m="ed" data-b="${b.id}">${I.edit}</button><button data-m="del" data-b="${b.id}">${I.del}</button></div>`:"";
 const ti=b.title?`<h3 dir="auto">${esc(b.title)}</h3>`:"";
 if(b.t==="card")return`<div class="cd">${tl}<h4 dir="auto" style="${ed?"padding-inline-end:70px":""}">${esc(b.title)}</h4><div class="tx" dir="auto">${fmt(b.body)}</div></div>`;
 if(b.t==="table"){const R=rows(b.body);if(!R.length)return`<div class="bk">${tl}${ti}</div>`;return`<div class="bk">${tl}${ti}<div class="tw"><table dir="auto"><thead><tr>${R[0].map(c=>`<th>${fmt(c)}</th>`).join("")}</tr></thead><tbody>${R.slice(1).map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
 if(b.t==="list")return`<div class="bk">${tl}${ti}<div class="txt"><ul class="ls" dir="auto">${String(b.body).split("\n").filter(x=>x.trim()).map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></div></div>`;
 if(b.t==="note")return`<div class="bk">${tl}<div class="note" dir="auto">${ti}<div class="tx">${fmt(b.body)}</div></div></div>`;
 return`<div class="bk">${tl}${ti}<div class="txt tx" dir="auto">${fmt(b.body)}</div></div>`}
const rows=s=>String(s||"").split("\n").filter(l=>l.trim()).map(l=>l.includes("\t")?l.split("\t"):l.split("|").map(x=>x.trim()));
function bind(){const g=(s,f)=>{const e=$(s);if(e)e.onclick=f},F=id=>S.topics.find(x=>x.id===id);
 $("#th").onclick=()=>{const d=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=d;try{localStorage.setItem("aref_theme",d)}catch(e){}render()};
 g("#av",e=>{e.stopPropagation();$("#am").classList.toggle("on")});g("#lo",()=>{pg="dash";logout()});g("#mb",()=>{$("#sd").classList.add("on");$("#sc").classList.add("on")});g("#sc",()=>{$("#sd").classList.remove("on");$("#sc").classList.remove("on")});
 g("#bk",()=>{pg="dash";cur=null;render()});g("#nt",()=>tform());g("#et",()=>tform(T()));g("#ab",()=>bform());
 const del=id=>{if(confirm("Delete this folder and all its content?")){S.topics=S.topics.filter(x=>x.id!==id);if(cur===id)cur=null;if(pg==="folder")pg="folders";save();render()}};
 g("#dt",()=>del(cur));
 document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>del(b.dataset.fd));
 document.querySelectorAll("[data-fe]").forEach(b=>b.onclick=()=>tform(F(b.dataset.fe)));
 document.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{const i=S.topics.findIndex(x=>x.id===b.dataset.id),j=b.dataset.fm==="up"?i-1:i+1;if(j<0||j>=S.topics.length)return;[S.topics[i],S.topics[j]]=[S.topics[j],S.topics[i]];save();render()});
 document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const v=b.dataset.pg;if(v==="home"){cur=null}else{pg=v;cur=null}render()});
 const qi=$("#q");if(qi)qi.oninput=()=>{q=qi.value;const sd=$("#sd");sd.querySelectorAll(".tp,.empty").forEach(e=>e.remove());qi.insertAdjacentHTML("afterend",side());sd.querySelectorAll(".tp").forEach(b=>b.onclick=pick);if(!cur)$("#pg").innerHTML=page(),document.querySelectorAll("#pg [data-t]").forEach(b=>b.onclick=pick)};
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=pick);
 document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const t=T(),i=t.blocks.findIndex(x=>x.id===b.dataset.b),m=b.dataset.m;
  if(m==="del"){if(confirm("Delete this block?")){t.blocks.splice(i,1);save();render()}}
  else if(m==="ed")bform(t.blocks[i]);else{const j=m==="up"?i-1:i+1;if(j<0||j>=t.blocks.length)return;[t.blocks[i],t.blocks[j]]=[t.blocks[j],t.blocks[i]];save();render()}})}
function pick(){cur=this.dataset.t;if(isA()&&pg!=="view")pg="folder";render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const m=$("#am");if(m&&!e.target.closest("#am"))m.classList.remove("on")});
function modal(h){$("#md").innerHTML=`<div class="ov"><div class="md">${h}</div></div>`}const close=()=>$("#md").innerHTML="";
function tform(t){modal(`<h3>${t?"Edit folder":"New folder"}</h3><label>Folder name</label><input id="f1" value="${esc(t?t.name:"")}"><label>Short description (optional)</label><input id="f2" value="${esc(t?t.desc||"":"")}"><div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Save</button></div>`);
 $("#x").onclick=close;$("#ok").onclick=()=>{const n=$("#f1").value.trim();if(!n)return;if(t){t.name=n;t.desc=$("#f2").value.trim()}else{S.topics.push({id:uid(),name:n,desc:$("#f2").value.trim(),blocks:[]})}save();close();render()}}
const HINT={text:"Free text. Use **bold** for emphasis. Links are clickable.",card:"One card (title + details). Consecutive cards show side by side.",table:"First line = headers. Separate cells with | (or paste straight from Excel). One row per line.",list:"One bullet per line.",note:"Highlighted note / warning."};
function bform(b){const t=T(),ty=b?b.t:"text";modal(`<h3>${b?"Edit block":"Add block"}</h3><label>Type</label><select id="f0" ${b?"disabled":""}>${Object.keys(HINT).map(k=>`<option value="${k}" ${k===ty?"selected":""}>${{text:"Text",card:"Card",table:"Table",list:"Bullet list",note:"Note"}[k]}</option>`).join("")}</select><label>Title</label><input id="f1" value="${esc(b?b.title:"")}"><label>Content</label><textarea id="f2" dir="auto">${esc(b?b.body:"")}</textarea><div class="h" id="hn">${HINT[ty]}</div><div class="row"><button class="btn g" id="x">Cancel</button><button class="btn" id="ok">Save</button></div>`);
 $("#f0").onchange=()=>$("#hn").textContent=HINT[$("#f0").value];$("#x").onclick=close;
 $("#ok").onclick=()=>{const o={t:$("#f0").value,title:$("#f1").value.trim(),body:$("#f2").value};if(b)Object.assign(b,o);else t.blocks.push(Object.assign({id:uid()},o));save();close();render()}}
/* ---- boot ---- */
(async()=>{$("#app").innerHTML='<div class="lg"><img src="'+LOGO+'" height="60"></div>';await load();
 try{const s=JSON.parse(localStorage.getItem("aref_ses")||"null");if(s){ses={role:s.role,name:s.name};if(s.role==="admin"){tok={ref:s.ref,exp:0};try{await token()}catch(e){ses=tok=null}}}}catch(e){}
 render();setInterval(async()=>{if(!ed&&!document.querySelector(".ov")&&ses){const o=JSON.stringify(S);await load();if(JSON.stringify(S)!==o){if(cur&&!T())cur=null;render()}}},60000)})();
</script></body></html>
