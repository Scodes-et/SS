 if(l){
  const rows=l.folders.map((x,i)=>{const r=x.ref?findCat(x.ref):null,nm=x.ref?(r?r.name:"(فولدر محذوف)"):x.name,cn=x.ref?(r?r.codes.length:0):x.items.length;return`<tr data-lrow="f" data-id="${x.id}"><td>${GRIP}</td><td>${esc(nm)}${x.ref?' <span class="badge w">فولدر موجود</span>':""}</td><td><span class="badge ${x.copy?"a":"i"}">${x.copy?"النسخ مسموح":"للView only"}</span></td><td>${cn}</td><td>${x.ref?"":`<button class="btn sm" data-act="ls_fopen" data-id="${x.id}">Open</button>`}<button class="btn gh sm" data-act="ls_fedit" data-id="${x.id}">Edit</button><button class="btn rd sm" data-act="ls_fdel" data-id="${x.id}">Delete</button></td></tr>`}).join("");
  return`<button class="btn gh bk" data-act="ls_back">← Back to Lists</button><div class="hd"><h2>${esc(l.name)}</h2><div class="row"><button class="btn gh" data-act="ls_fadd">+ New Folder</button><button class="btn" data-act="ls_fpick">+ Add Existing Folders</button></div></div><div class="tw">${rows?`<table><tr><th>Order</th><th>Folder</th><th>Copy</th><th>Codes</th><th>Actions</th></tr>${rows}</table>`:'<div class="empty">لا توجد فولدرات. اضغط + Add Folder.</div>'}</div>`}
 let body;
 if(!LOK&&!LST.length)body='<div class="empty"><i class=spn></i> Loading...</div>';
 else if(!LST.length)body='<div class="empty">لا توجد قوائم بعد. اضغط + Add List.</div>';
 else body=`<table><tr><th>Order</th><th>List Name</th><th>Folders</th><th>Codes</th><th>Actions</th></tr>${LST.map((x,i)=>`<tr data-lrow="l" data-id="${x.id}"><td>${GRIP}</td><td>${esc(x.name)}</td><td>${x.folders.length}</td><td>${lCnt(x)}</td><td><button class="btn sm" data-act="ls_open" data-id="${x.id}">Open</button><button class="btn gh sm" data-act="ls_edit" data-id="${x.id}">Rename</button><button class="btn rd sm" data-act="ls_del" data-id="${x.id}">Delete</button></td></tr>`).join("")}</table>`;
 return`<div class="hd"><h2>Lists</h2><button class="btn" data-act="ls_add">+ Add List</button></div><p style="margin-bottom:14px;color:var(--mut);line-height:1.8;font-size:.9rem">كل ليست بتظهر للموظفين في القائمة الجانبية (ومفيش أي قائمة بتظهر غير اللي بتعملها هنا). جوه الليست تقدر تضيف فولدرات من الموجودين أو تعمل فولدر جديد، ومن خانة النسخ بتحدد الموظف يقدر ينسخ ولا للView only.</p><div class="tw">${body}</div>`}
function lAct(a,id){
 const go=p=>p.then(e=>{if(e)toast(e,"err");else render()});
 const fl=(L,i)=>L.find(x=>x.id===i);
 const gf=L=>{const t=fl(L,lopen);return t&&t.folders.find(x=>x.id===lfold)};
 const swap=(arr,i,d)=>{const j=i+d;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
 const cp=(t,ok)=>copyText(t).then(o=>toast(o?"✓ تم Copy description":"تعذر النسخ التلقائي، حدد الوصف وانسخه يدويًا",o?"":"err"));
 if(a==="us_view"){uview=id;ufold=null;ucat=ucode=null;q="";uside=false;render();return}
 if(a==="us_cat"){uview="codes";ucat=id;ucode=null;q="";uside=false;render();return}
 if(a==="us_fold"){if(uview==="codes"){const ll=LST.find(x=>lFolders(x).some(f=>f.id===id));if(ll)uview=ll.id}ufold=id;q="";uside=false;render();return}
 if(a==="us_fback"){ufold=null;render();return}
 if(a==="us_home"){uview="codes";ufold=null;ucat=ucode=null;q="";uside=false;render();return}
 if(a==="us_menu"){uside=!uside;render();return}
 if(a==="cdesc"){const k=fdItem(id),t=k?String(k.description||"").trim():"";if(t)cp(t);return}
 if(a==="cdescp"){if(popDesc){cp(popDesc);clearTimeout(popT);popT=setTimeout(closePop,4000)}return}
 if(a==="litem"){for(const l of LST)for(const f of lFolders(l)){const i=f.items.find(x=>x.id===id);if(i){(f.copy?showCode:showView)({name:i.name,shortCode:i.value,description:i.description,copyDesc:i.copyDesc});return}}return}
 if(!isAdm())return;
 switch(a){
 case"ls_back":if(lfold)lfold=null;else lopen=null;render();break;
 case"ls_open":lopen=id;lfold=null;render();break;
 case"ls_fopen":lfold=id;render();break;
 case"ls_add":case"ls_edit":{const l=a==="ls_edit"?LST.find(x=>x.id===id):null;
  formModal(l?"Rename List":"Add List",inp("اسم الليست","name",l?l.name:"","text",1)+(l?"":catPick(new Set())+chk(CPL,"copy",false)),l?"Save":"Create",async d=>{
   const n=d.name.trim();if(!n)return"اسم الليست مطلوب.";if(n.length>60)return"الاسم طويل جدًا.";
   if(LST.some(x=>norm(x.name)===norm(n)&&(!l||x.id!==l.id)))return"الليست دي موجودة بالفعل.";
   const e=await lMut(L=>{if(l){const t=fl(L,l.id);if(!t)return"الليست غير موجودة.";t.name=n}else L.push({id:uid(),name:n,folders:catPicked(d).map(c=>refEntry(c,d.copy))})});
   if(e)return e;render();toast("✓ تم الحفظ — هتظهر للموظفين خلال لحظات")});break}
 case"ls_del":{const l=LST.find(x=>x.id===id);if(!l)break;
  confirmModal("حذف الليست «"+esc(l.name)+"» وكل الفولدرات والأكواد اللي فيها؟","Delete",()=>go(lMut(L=>{const i=L.findIndex(x=>x.id===id);if(i>=0)L.splice(i,1)})),"Delete List");break}
 case"ls_up":case"ls_down":go(lMut(L=>{swap(L,L.findIndex(x=>x.id===id),a==="ls_up"?-1:1)}));break;
 case"ls_fpick":{const l=LST.find(x=>x.id===lopen);if(!l)break;
  formModal("إضافة فولدرات موجودة",catPick(new Set(l.folders.filter(x=>x.ref).map(x=>x.ref)))+chk(CPL,"copy",false),"Add",async d=>{
   const ids=catPicked(d);if(!ids.length)return"اختر فولدر واحد على الأقل.";
   const e=await lMut(L=>{const t=fl(L,l.id);if(!t)return"الليست غير موجودة.";ids.forEach(c=>{if(!t.folders.some(f=>f.ref===c))t.folders.push(refEntry(c,d.copy))})});
   if(e)return e;render();toast("✓ تمت الإضافة")});break}
 case"ls_fadd":case"ls_fedit":{const l=LST.find(x=>x.id===lopen);if(!l)break;const f=a==="ls_fedit"?l.folders.find(x=>x.id===id):null;
  if(f&&f.ref){formModal("Folder Settings",'<p style="color:var(--mut);line-height:1.7;font-size:.9rem">الفولدر ده مربوط بفولدر موجود، فاسمه وأكواده بتتعدل من صفحة Categories / Short Codes.</p>'+chk(CPL,"copy",f.copy),"Save",async d=>{
    const e=await lMut(L=>{const t=fl(L,l.id),o=t&&t.folders.find(x=>x.id===f.id);if(!o)return"الفولدر غير موجود.";o.copy=!!d.copy});
    if(e)return e;render();toast("✓ تم الحفظ")});break}
  formModal(f?"Edit Folder":"Add Folder",inp("اسم الفولدر","name",f?f.name:"","text",1)+chk("السماح للموظفين بنسخ الأكواد اللي جوه الفولدر ده (لو مش معلّم: للView only)","copy",f&&f.copy),f?"Save":"Create",async d=>{
   const n=d.name.trim();if(!n)return"اسم الفولدر مطلوب.";if(n.length>60)return"الاسم طويل جدًا.";
   const e=await lMut(L=>{const t=fl(L,l.id);if(!t)return"الليست غير موجودة.";
    if(t.folders.some(x=>norm(x.name)===norm(n)&&(!f||x.id!==f.id)))return"الفولدر ده موجود بالفعل في الليست.";
    if(f){const o=t.folders.find(x=>x.id===f.id);if(!o)return"الفولدر غير موجود.";o.name=n;o.copy=!!d.copy}
    else t.folders.push({id:uid(),name:n,copy:!!d.copy,items:[]})});
   if(e)return e;render();toast("✓ تم الحفظ")});break}
 case"ls_fdel":{const l=LST.find(x=>x.id===lopen),f=l&&l.folders.find(x=>x.id===id);if(!f)break;
  confirmModal(f.ref?"إزالة الفولدر من الليست؟ (الفولدر الأصلي وأكواده مش هيتحذفوا)":"حذف الفولدر «"+esc(f.name)+"» وكل أكواده؟","Delete",()=>go(lMut(L=>{const t=fl(L,lopen);if(!t)return"الليست غير موجودة.";t.folders=t.folders.filter(x=>x.id!==id)})),"Delete Folder");break}
 case"ls_fup":case"ls_fdown":go(lMut(L=>{const t=fl(L,lopen);if(!t)return"الليست غير موجودة.";swap(t.folders,t.folders.findIndex(x=>x.id===id),a==="ls_fup"?-1:1)}));break;
 case"ls_iup":case"ls_idown":go(lMut(L=>{const f=gf(L);if(!f)return"الفولدر غير موجود.";swap(f.items,f.items.findIndex(x=>x.id===id),a==="ls_iup"?-1:1)}));break;
 case"ls_idel":confirmModal("حذف هذا الكود؟","Delete",()=>go(lMut(L=>{const f=gf(L);if(!f)return"الفولدر غير موجود.";f.items=f.items.filter(x=>x.id!==id)})),"Delete Code");break;
 case"ls_iadd":case"ls_iedit":{const l=LST.find(x=>x.id===lopen),fo=l&&l.folders.find(x=>x.id===lfold);if(!fo)break;const it=a==="ls_iedit"?fo.items.find(x=>x.id===id):null;
  formModal(it?"Edit Code":"Add Code",inp("الاسم","name",it?it.name:"","text",1)+txa("الكود / المحتوى *","value",it?it.value:"")+txa("Description (optional)","description",it?it.description:"")+chk(SDL,"showDesc",it&&it.showDesc)+chk(CDL,"copyDesc",it&&it.copyDesc),it?"Save":"Create",async d=>{
   const n=d.name.trim(),v=d.value.trim(),ds=d.description.trim();
   if(!n||!v)return"الاسم والكود مطلوبان.";
   if(n.length>100||v.length>1000||ds.length>500)return"Text is too long.";
   const e=await lMut(L=>{const f=gf(L);if(!f)return"الفولدر غير موجود.";
    if(f.items.some(x=>norm(x.name)===norm(n)&&(!it||x.id!==it.id)))return"الاسم موجود بالفعل في الفولدر.";
    if(it){const o=f.items.find(x=>x.id===it.id);if(!o)return"الكود غير موجود.";Object.assign(o,{name:n,value:v,description:ds,showDesc:!!d.showDesc,copyDesc:!!d.copyDesc})}
    else f.items.push({id:uid(),name:n,value:v,description:ds,showDesc:!!d.showDesc,copyDesc:!!d.copyDesc})});
   if(e)return e;render();toast("✓ تم الحفظ")});break}
 }}

/* ===== Actions ===== */
function act(a,id){
 if(a==="calcsave"){calcSave();return}if(a==="calcreset"){calcReset();return}
 if(a==="nopen"||a==="nref"||a==="nsend"||a==="ndel"||a==="nread"||a==="nreadall"){nAct(a,id);return}
 if(/^(ls_|us_)/.test(a)||a==="cdesc"||a==="cdescp"||a==="litem"){lAct(a,id);return}
 const ok=()=>{save();render()};
 switch(a){
 case"close":closeModal();break;
 case"notes":nwToggle();break;
 case"kcalc":kcToggle();break;
 case"logout":nwTeardown();KC={uid:"",open:false,min:false,x:null,y:null,expr:"",res:"",done:false};const kw=$("#kw");if(kw)kw.innerHTML="";updAvail=false;calcV={p:"",n:""};lmode="in";closePop();q="";tok=null;session=null;ucat=ucode=null;menu=false;closeModal();render();break;
 case"theme":{const d=document.documentElement,n=d.dataset.theme==="dark"?"light":"dark";d.dataset.theme=n;try{localStorage.setItem("ShortCodeAssistant_theme",n)}catch(e){}break}
 case"phref":loadPh();toast("جاري التحديث");break;
 case"phok":{const q=PH.list.find(x=>x.id===id);if(!q)break;const u=S.users.find(x=>x.id===id);
  if(!u){toast("المستخدم غير موجود","err");PH.list=PH.list.filter(x=>x.id!==id);phDel(id).catch(()=>{});render();break}
  u.phone=q.phone;PH.list=PH.list.filter(x=>x.id!==id);ok();toast("تم تحديث رقم "+u.name);phDel(id).catch(e=>console.error(e));break}
 case"phno":{PH.list=PH.list.filter(x=>x.id!==id);render();phDel(id).catch(e=>console.error(e));break}
 case"phupd":{const u=needPh();if(!u)break;
  formModal("تحديث بيانات الحساب",'<p style="margin-bottom:10px;color:var(--mut);font-size:.9rem;line-height:1.7">اكتب رقم تليفونك واسم المستخدم وكلمة المرور للتأكيد.</p>'+inp("Phone Number","phone","","tel",1)+inp("Username","username","","text",1)+inp("Password","password","","password",1),"إرسال",async d=>{
   const ph=cleanPh(d.phone||""),un=norm(d.username||""),pw=d.password||"";
   if(!okPh(ph))return"رقم التليفون غير صحيح (من 8 إلى 15 رقم).";
   if(!un||!pw)return"جميع الحقول مطلوبة.";
   if(un!==norm(u.username)||await H(u.salt,pw)!==u.hash)return"اسم المستخدم أو كلمة المرور غير صحيحة.";
   const r=await createPh({id:u.id,name:u.name,username:u.username,phone:ph});
   if(r==="deny")return"الخدمة غير مفعّلة حاليًا. تواصل مع الأدمن.";
   if(r==="err")return"تعذر الإرسال. تأكد من الاتصال وحاول مرة أخرى.";
   try{localStorage.setItem("ph_"+u.id,"1")}catch(e){}
   toast("تم الإرسال للأدمن، شكرًا");render()});break}
 case"reqref":loadReqs();toast("جاري التحديث");break;
 case"copyrules":copyText(($("#rulesTx")||{}).textContent||"").then(o=>toast(o?"تم نسخ القواعد":"تعذر النسخ",o?"":"err"));break;
 case"reqok":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  if(!/^[0-9a-f]{64}$/.test(q.hash)||!q.salt){toast("بيانات الطلب غير صالحة","err");break}
  if(norm(q.username)==="admin"||S.users.some(x=>norm(x.username)===norm(q.username))){toast("اسم المستخدم موجود بالفعل","err");break}
  S.users.push({id:uid(),name:q.name,username:q.username,status:"active",phone:q.phone||"",salt:q.salt,hash:q.hash});
  REQ.list=REQ.list.filter(x=>x.id!==id);ok();toast("تمت الموافقة، تقدر "+q.name+" يدخل دلوقتي");
  (async()=>{await pushRemote();try{if(!S._dirty)await reqDel(id);else await reqPatch(id,"approved")}catch(e){console.error(e)}})();break}
 case"reqno":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  confirmModal("رفض طلب «"+esc(q.name)+"»؟ مش هيقدر يدخل وهتظهر له رسالة إن الأدمن رفض دخوله.","Reject",async()=>{
   try{await reqPatch(id,"rejected");q.status="rejected";render();toast("تم رفض الطلب")}catch(e){toast(fbMsg(e),"err")}},"Reject Request");break}
 case"reqdel":{const q=REQ.list.find(x=>x.id===id);if(!q)break;
  confirmModal("حذف الطلب نهائيًا؟ ممكن بعدها نفس اليوزر يقدّم من جديد.","Delete",async()=>{
   try{await reqDel(id);REQ.list=REQ.list.filter(x=>x.id!==id);render();toast("تم حذف الطلب")}catch(e){toast(fbMsg(e),"err")}},"Delete Request");break}
 case"menu":menu=!menu;render();break;
 case"nav":page=id;menu=false;render();if(id==="users"){loadReqs();loadPh()}if(id==="creq")loadCReqs();if(id==="notif")loadNotifs();if(id==="lists"){lopen=lfold=null;loadNotifs()}if(id==="log")act("logref");break;
 case"logref":{if(S._dirty||pushing){toast("فيه تعديلات لسه بتتحفظ، جرّب بعد لحظات","err");break}
  fetchRemote().then(r=>{if(!r||!r.cats){toast("تعذر جلب البيانات من Firebase","err");return}setRem(r);S=fromRemote(r);save(true);if(isAdm())render()});break}
 case"logclr":confirmModal("هل أنت متأكد من مسح سجل التعديلات؟","Clear",()=>{S.log=[];ok()},"Clear Log");break;
 case"catup":case"catdown":{const i=S.categories.findIndex(c=>c.id===id),j=a==="catup"?i-1:i+1;if(i<0||j<0||j>=S.categories.length)break;[S.categories[i],S.categories[j]]=[S.categories[j],S.categories[i]];ok();break}
 case"urefresh":{if(!session||session.role!=="user"||rfBusy)break;
  if(S._dirty||pushing){toast("فيه تعديلات لسه بتتحفظ، جرّب بعد لحظات","err");break}
  rfBusy=true;loadNotifs();const sp=v=>{const e=$("#rfb");if(e)e.classList.toggle("spin",v)};sp(true);
  fetchRemote().then(async r=>{
   if(!r||!r.cats){sp(false);toast("تعذر الاتصال، حاول مرة أخرى","err");return}
   const ch=r.c.t!==rem.c.t||!!(r.u&&(r.u.t!==rem.u.t||r.u.e!==rem.u.e));
   setRem(r);S=fromRemote(r);await migrate(S);save(true);updAvail=false;
