<style>
:root{--navy:#151515;--navy2:#2a2a2a;--blue:#de0702;--green:#16a34a;--red:#8f0401;--bg:#f4f4f5;--card:#fff;--tx:#141414;--mut:#6b7280;--bd:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:16px}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--blue);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn.gr{background:var(--green)}.btn.rd{background:var(--red)}.btn.gh{background:#e2e8f0;color:var(--tx)}.btn.sm{padding:6px 12px;font-size:.85rem}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),#1e3a8a);padding:16px}
.lbox{background:#fff;border-radius:18px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 50px #0006}
.lbox h1{color:var(--navy);text-align:center;margin-bottom:4px}.lbox .sub{text-align:center;color:var(--mut);margin-bottom:20px;font-size:.9rem}
.fld{margin-bottom:14px}.fld label{display:block;font-weight:600;margin-bottom:5px;font-size:.9rem}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue)}
.err{color:var(--red);font-size:.9rem;min-height:20px;margin-bottom:8px}
.note{font-size:.78rem;color:var(--mut);text-align:center;margin-top:14px}
.lbox .btn{width:100%;padding:12px}
/* admin */
.shell{display:flex;min-height:100vh}
.side{width:240px;background:var(--navy);color:#cbd5e1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.side h2{color:#fff;font-size:1.1rem;padding:0 10px 16px}
.side a{display:block;padding:11px 14px;border-radius:10px;cursor:pointer}
.side a:hover{background:var(--navy2)}.side a.on{background:var(--blue);color:#fff}.side .sp{flex:1}
.main{flex:1;padding:24px;min-width:0}
.top{display:none;background:var(--navy);color:#fff;padding:10px 14px;align-items:center;gap:12px}
.top button{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.hd h2{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.st{background:var(--card);border-radius:14px;padding:20px;border-inline-start:5px solid var(--blue);box-shadow:0 1px 4px #0001}
.st b{display:block;font-size:2rem;color:var(--navy)}.st span{color:var(--mut)}
.tw{background:var(--card);border-radius:14px;overflow-x:auto;box-shadow:0 1px 4px #0001}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--bd)}
th{background:#f8fafc;color:var(--mut);font-size:.85rem}
td .btn{margin-inline-end:6px}
.badge{padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:600}.badge.a{background:#dcfce7;color:#166534}.badge.i{background:#fee2e2;color:#991b1b}
.empty{padding:28px;text-align:center;color:var(--mut)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:Consolas,monospace;text-align:start}
.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 4px #0001;margin-bottom:16px;max-width:520px}
.card h3{margin-bottom:12px;color:var(--navy)}
/* user */
.uhead{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.uhead h1{font-size:1.25rem}.uhead small{color:#94a3b8;display:block}
.uwrap{max-width:900px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cc{background:var(--card);border:2px solid transparent;border-radius:14px;padding:24px 18px;cursor:pointer;text-align:start;box-shadow:0 1px 5px #0001;transition:.15s;width:100%}
.cc:hover{border-color:var(--blue);transform:translateY(-2px)}
.cc b{display:block;font-size:1.2rem;color:var(--navy);margin-bottom:6px}.cc span{color:var(--mut);font-size:.9rem}
.cc.code b{margin:0;font-size:1.15rem}
.list{display:flex;flex-direction:column;gap:12px}
.ci{background:var(--card);border-radius:14px;box-shadow:0 1px 5px #0001;border:2px solid transparent;overflow:hidden;transition:border-color .25s}
.ci.open{border-color:var(--green)}
.ci .cc{display:flex;justify-content:space-between;align-items:center;box-shadow:none;border:0;border-radius:0;background:none;padding:20px 18px}
.ci .cc:hover{transform:none;background:#f8fafc}
.ci .cc i{font-style:normal;color:var(--mut);transition:transform .35s}
.ci.open .cc i{transform:rotate(180deg)}
.cx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.ci.open .cx{grid-template-rows:1fr}
.cin{overflow:hidden;min-height:0;text-align:center;padding:0 16px;opacity:0;transition:opacity .3s,padding .35s}
.ci.open .cin{opacity:1;padding:4px 16px 20px}
.ci.open .big{animation:pop .4s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.grid.gs{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gs .cc{text-align:center;padding:18px 10px;display:flex;align-items:center;justify-content:center;min-height:76px}
.gs .cc b{margin:0;font-size:1rem}.cc:active{transform:scale(.97)}
.pov{position:fixed;inset:0;background:#0f1f3d99;display:flex;align-items:center;justify-content:center;z-index:60;padding:14px;animation:fd .2s;cursor:pointer}
.pbox{background:#fff;border-radius:22px;padding:26px 24px 0;text-align:center;width:min(92vw,520px);overflow:hidden;box-shadow:0 20px 60px #0006;animation:pp .38s cubic-bezier(.2,1.3,.4,1)}
.pnm{color:var(--mut);font-size:1.15rem}.pok{color:var(--green);font-weight:700}

.hst b{font-size:2rem}.hst span{font-size:.85rem}
.hact{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid #ffffff33;padding-top:18px}
.hact button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;background:#ffffff22;color:#fff;font-family:inherit;font-weight:600;font-size:.9rem;padding:10px 16px;cursor:pointer;transition:background .15s}
.hact button:hover{background:#ffffff3a}
.hact svg{width:18px;height:18px}
.hact .rf.spin svg{animation:rfs .8s linear infinite}
.hact .rf.new{background:#fff;color:#de0702}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hact{border-top:0;padding-top:0;margin:0;gap:8px;justify-content:flex-start;flex-wrap:nowrap}
.hact button{font-size:.9rem;padding:10px 14px;white-space:nowrap}
@media(max-width:820px){.hact{flex-wrap:wrap}}
.hact svg{width:20px;height:20px}
.ccalc{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:0 auto;width:100%;max-width:440px;box-sizing:border-box;background:#ffffff22;border-radius:14px;padding:10px 12px}
.ccalc label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;font-weight:600;font-size:.78rem;color:#ffffffe6;text-align:center}
.ccalc .cin{opacity:1;overflow:visible;min-height:auto;transition:none;font-family:inherit;font-size:1.05rem;font-weight:700;padding:7px 8px;border-radius:10px;border:0;background:#fff;color:#222;direction:ltr;text-align:center;width:100%;box-sizing:border-box}
.ccalc .cin:focus{outline:2px solid #ffffff99}
.ccalc .cin:disabled{opacity:.55;cursor:not-allowed}
.ccalc .ceq{color:#fff;font-size:1.1rem;padding-bottom:6px}
@media(max-width:520px){.hero .hmain h2{font-size:1.7rem}.hact{width:100%;max-width:none}.hact button{flex:1 1 44%;justify-content:center}}

/* ===== Softer dark mode: slate palette, visible borders, calmer hero red ===== */
html[data-theme=dark]{--card:#262b36;--tx:#eceef4;--mut:#a9afbe;--bd:#465066;--line:#ffffff26}
html[data-theme=dark] body,html[data-theme=dark] .boot{background:#1a1d25;color:#eceef4}
html[data-theme=dark] :is(.st,.tw,.card,.fo,.cc.code,.gs .cc,.sb,.md,.pbox){background:#262b36;box-shadow:0 0 0 1px #4a5266}
html[data-theme=dark] .sb{border-color:#4a5266}
html[data-theme=dark] .uhead{background:#12151c}
html[data-theme=dark] .hero{background:linear-gradient(135deg,#b3120d,#6e0805);box-shadow:0 10px 30px #00000055}
html[data-theme=dark] .fld input,html[data-theme=dark] .fld select,html[data-theme=dark] .fld textarea,html[data-theme=dark] .lw input{background:#1f232c;border-color:#465066;color:#f0f2f7}
html[data-theme=dark] .fld input:focus,html[data-theme=dark] .fld select:focus,html[data-theme=dark] .fld textarea:focus{background:#1f232c;border-color:#de0702}
html[data-theme=dark] th,html[data-theme=dark] tr:hover td{background:#2e3441}
html[data-theme=dark] th,html[data-theme=dark] td{border-bottom-color:#ffffff1f}
html[data-theme=dark] .fo small,html[data-theme=dark] .btn.gh,html[data-theme=dark] .btn.gr{background:#323847}
html[data-theme=dark] .btn.gh:hover{background:#3d4558}
html[data-theme=dark] .sb .x,html[data-theme=dark] .pbar{background:#3a4152}
html[data-theme=dark] .te.sg button{background:#343b4b;box-shadow:0 0 0 1px #ffffff2e}
html[data-theme=dark] .uside .band{box-shadow:0 0 0 1px #4a5266}
html[data-theme=dark] .uside .band.on{box-shadow:none}

/* ===== Etisalat polish: logo tile, red accents, employee view ===== */
:root{--ac:#de0702;--ac2:#b00602;--etr:#de0702}
.ubrand img,.sbrand img,.top img{width:46px;height:46px;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px #ffffff26,0 6px 16px #de070247}
.top img{width:36px;height:36px;border-radius:10px}
.sbrand img{width:50px;height:50px}
.lbrand{background:linear-gradient(155deg,#e60a04 0%,#de0702 45%,#a90400 100%)}
.lbrand img{filter:none;width:min(250px,66%)}
.uhead{background:linear-gradient(90deg,#0c0c0e,#17171b)}
.uhead::after{height:3px;background:linear-gradient(90deg,#de0702,#ff4a43 50%,#de0702)}
.uhead h1{letter-spacing:.2px}
.uside .band{border-radius:14px;transition:transform .15s,box-shadow .15s,background .15s}
.uside .band:hover{transform:translateX(-3px)}
.uside .band.on{background:linear-gradient(135deg,#e30a05,#b40500);box-shadow:0 8px 20px #de070244}
.sb{border-radius:18px}
.sb:focus-within{border-color:#de0702;box-shadow:0 0 0 4px #de070222}
.hero{position:relative;overflow:hidden;border-radius:24px}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;z-index:0;width:380px;height:380px;border-radius:50%;border:1px solid #ffffff2e;top:-190px;inset-inline-start:-120px}
.hero::after{content:"";position:absolute;z-index:0;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,#ffffff22 0,transparent 66%);bottom:-260px;inset-inline-end:-140px}
html:not([data-theme=dark]) .hero{background:linear-gradient(135deg,#e60a04 0%,#c70500 55%,#930300 100%);box-shadow:0 18px 40px #de070233}
.hst>*{background:#ffffff1f;border:1px solid #ffffff2e;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;transition:transform .15s,background .15s}
.hst>*:hover{transform:translateY(-3px);background:#ffffff2e}
.hst b{font-size:2.3rem;line-height:1.1;letter-spacing:.5px}
.hst span{margin-top:6px;display:block;font-weight:600;opacity:.95}
.hact button{border:1px solid #ffffff2e;border-radius:99px;background:#ffffff1f}
.hact button:hover{background:#ffffff38;transform:translateY(-1px)}
.hact .rf.new{background:#fff;color:#de0702;box-shadow:0 0 0 4px #ffffff33}
.hero .hmain small{font-size:1rem;font-weight:600}
.hero .hmain h2{text-shadow:0 2px 14px #00000033}
.ccalc{border:1px solid #ffffff2e;background:#00000026;border-radius:18px}
.fo{border-radius:20px}
.fo .fi{background:#de070214;color:#de0702}
.fo:hover{box-shadow:0 0 0 1.5px #de0702,0 16px 30px #de070224}
.fo:hover .fi{background:#de0702;color:#fff}
.bk{border-radius:99px}
.btn{background:linear-gradient(135deg,#e30a05,#c10500);box-shadow:0 4px 12px #de070233}
.btn:hover{background:linear-gradient(135deg,#c10500,#a30400)}
.btn.gh,.btn.rd{box-shadow:none}
.btn.gh{background:#0000000f;color:inherit}
.btn.rd{background:#7a1a17}
html:not([data-theme=dark]) body{background-image:radial-gradient(900px 420px at 100% -120px,#de070214,transparent 70%)}
.side .on,.side a.on{background:linear-gradient(90deg,#de070233,transparent)}
.side a.on{box-shadow:inset 3px 0 0 #de0702}
.tt{border-inline-start-color:#de0702}
@media(max-width:800px){.hst b{font-size:1.9rem}.hero::before{width:260px;height:260px;top:-130px}}

/* ===== v3: login redesign ===== */
.login{background:#0b0b0d}
.login::before{background:radial-gradient(55% 55% at 90% 8%,#de070240 0,transparent 70%),radial-gradient(50% 50% at 8% 95%,#de070230 0,transparent 70%)}
.lc{max-width:1000px;grid-template-columns:1.05fr 1fr;border-radius:30px;box-shadow:0 50px 110px #000c,0 0 0 1px #ffffff1a}
.lbrand{padding:52px 40px;gap:20px;background:linear-gradient(160deg,#ee0b05 0%,#de0702 42%,#a90400 100%)}
.lbrand::before,.lbrand::after{display:none}
.lorb{position:absolute;border-radius:50%;pointer-events:none}
.lorb.o1{width:440px;height:440px;border:1px solid #ffffff30;top:-190px;inset-inline-start:-190px}
.lorb.o2{width:560px;height:560px;background:radial-gradient(circle,#ffffff22 0,transparent 66%);bottom:-300px;inset-inline-end:-220px}
.lbrand img{position:relative;z-index:1;width:min(270px,70%);filter:drop-shadow(0 12px 28px #6a000040);margin-bottom:6px}
.lbrand h2{font-size:1.45rem;letter-spacing:.3px}
.lbrand p{margin:-6px auto 4px;color:#ffe6e4;font-size:1rem}
.lfeat{position:relative;z-index:1;list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:10px;width:100%;max-width:330px;text-align:start}
.lfeat li{display:flex;align-items:center;gap:12px;background:#ffffff1c;border:1px solid #ffffff2b;border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:.9rem;font-weight:600}
.lfeat i{width:34px;height:34px;border-radius:10px;background:#ffffff26;display:grid;place-items:center;flex-shrink:0}
.lfeat svg{width:18px;height:18px}
.lform{padding:44px 46px}
.lhead{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.lhead h1{margin:0;font-size:1.65rem;line-height:1.25}
.lhead .lsub{margin:2px 0 0;font-size:.92rem}
.lbadge{width:52px;height:52px;border-radius:15px;overflow:hidden;flex-shrink:0;box-shadow:0 8px 20px #de070240}
.lbadge img{width:100%;height:100%;display:block}
.ltabs{border-radius:16px;padding:5px;margin-bottom:28px}
.ltabs button{border-radius:12px;padding:11px 8px;font-size:.96rem}
.ltabs button.on{background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff;box-shadow:0 8px 18px #de070240}
.lw input{padding:15px 46px;border-radius:14px;border-width:1.5px;font-size:1.02rem}
.lf label{font-size:.86rem;letter-spacing:.2px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:15px;font-size:1.05rem;background:linear-gradient(135deg,#ee0b05,#c60500);box-shadow:0 14px 28px #de070247}
.lbtn:hover{background:linear-gradient(135deg,#d90903,#a90400);transform:translateY(-1px)}
.lbtn .arw{width:19px;height:19px;transition:transform .2s}
.lbtn:hover .arw{transform:translateX(-4px)}
.lbtn:disabled{opacity:.7;cursor:wait}
@media(max-width:860px){.lc{grid-template-columns:1fr;max-width:460px}.lbrand{padding:30px 24px 26px;gap:10px}.lbrand img{width:150px}.lbrand h2{font-size:1.15rem}.lbrand p,.lfeat{display:none}.lform{padding:26px 22px 30px}.lhead h1{font-size:1.4rem}.lbadge{width:46px;height:46px}.lorb.o1{width:300px;height:300px}}

/* ===== v3: employee header actions ===== */
.uact{gap:8px}
.hb{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border:1px solid #ffffff1f;border-radius:99px;background:#ffffff12;color:#fff;font-family:inherit;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap;transition:background .15s,transform .15s,border-color .15s}
.hb:hover{background:#ffffff26;border-color:#ffffff40;transform:translateY(-1px)}
.hb:focus-visible{outline:3px solid #ffffff88;outline-offset:2px}
.hb svg{width:19px;height:19px;flex-shrink:0}
.hb .nbd{position:absolute;top:-6px;inset-inline-end:-4px;border:2px solid #0c0c0e}
.hb.rf.new{background:#fff;color:#de0702;border-color:#fff;box-shadow:0 0 0 4px #ffffff30}
.hb.rf.spin svg{animation:rfs .8s linear infinite}
.hb.lo{background:#de070233;border-color:#de070266}
.hb.lo:hover{background:#de0702}
.hb.tgl .ld{display:none}
html[data-theme=dark] .hb.tgl .lm{display:none}html[data-theme=dark] .hb.tgl .ld{display:inline}
@media(max-width:1060px){.hb{width:42px;padding:0;justify-content:center}}
@media(max-width:800px){.uhead{flex-wrap:wrap;gap:12px}.uact{width:100%;justify-content:space-between;order:3}.hb{flex:1;max-width:64px;height:40px}.uhead .umb{order:-1}}

/* ===== v3: hero card + calculator ===== */
.hero{gap:22px;padding:30px 30px 28px}
.hero .hmain h2{font-size:2.3rem}
.hst>*{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 12px 16px}
.hst .hi{width:38px;height:38px;border-radius:12px;background:#ffffff26;display:grid;place-items:center;margin-bottom:6px;font-style:normal}
.hst .hi svg{width:20px;height:20px}
.hst b{font-size:2.1rem}
.ccalc{display:block;max-width:none;width:100%;margin:0;padding:18px;border-radius:22px;background:#ffffff;border:0;box-shadow:0 18px 40px #0000002e;color:#18181b}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cic{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:0 8px 16px #de070244}
.cic svg{width:22px;height:22px}
.chead b{display:block;font-size:1.05rem;color:#18181b}
.chead small{display:block;font-size:.8rem;color:#6b7280;margin-top:2px;opacity:1}
.crow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.ccalc label{display:block;text-align:start;color:#3a3a40}
.ccalc .cl{display:block;font-size:.8rem;font-weight:700;color:#6b7280;margin-bottom:6px}
.cbox{position:relative}
.ccalc .cin{background:#f3f4f7;border:1.5px solid #e3e5ea;color:#18181b;border-radius:14px;padding:13px 54px 13px 14px;font-size:1.35rem;font-weight:800;text-align:start;direction:ltr;transition:border-color .2s,box-shadow .2s,background .2s}
.ccalc .cin:focus{outline:0;border-color:#de0702;background:#fff;box-shadow:0 0 0 4px #de070222}
.ccalc .cin::placeholder{color:#b4b8c2}
.cbox i{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.76rem;font-weight:700;color:#de0702;background:#de070214;border-radius:99px;padding:3px 9px;pointer-events:none}
.ccalc .ceq{width:40px;height:40px;border-radius:50%;background:#18181b;color:#fff;display:grid;place-items:center;font-size:1.1rem;padding:0;margin-bottom:5px}
.ccalc.off{opacity:.9}.ccalc.off .cin{cursor:not-allowed;opacity:.6}
html[data-theme=dark] .ccalc{background:#1d2129;color:#eceef4;box-shadow:0 18px 40px #0000004d}
html[data-theme=dark] .chead b{color:#eceef4}html[data-theme=dark] .chead small,html[data-theme=dark] .ccalc .cl{color:#a9afbe}
html[data-theme=dark] .ccalc .cin{background:#12151c;border-color:#465066;color:#eceef4}
html[data-theme=dark] .ccalc .cin:focus{background:#171b24}
html[data-theme=dark] .ccalc .ceq{background:#de0702}
@media(max-width:600px){.hero{padding:22px 18px}.crow{grid-template-columns:1fr;gap:8px}.ccalc .ceq{margin:0 auto;transform:rotate(90deg)}.hero .hmain h2{font-size:1.8rem}}

/* v3 fixes */
html:not([data-theme=dark]) .ltabs button.on,html[data-theme=dark] .ltabs button.on{background:linear-gradient(135deg,#ee0b05,#c60500);color:#fff}
html:not([data-theme=dark]) .ltabs button:not(.on):hover{color:#141416}
.ccalc .cin{padding:13px 62px 13px 14px}
.cbox i{inset-inline-end:auto;right:12px;left:auto}
.hb>span:not(.nbd){display:inline}

/* ===== v16: new login / signup design ===== */
/* ===== Login (3aref) - matches Futuristic_3aref_Login_Experience ===== */
.lx{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#4a0000;font-family:Inter,"IBM Plex Sans Arabic","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#141414;direction:ltr}

.lxhero,.lxicon{display:none}
.lxform{display:contents}
.lxform>*,.lxtg{position:absolute}
.lxform>*{left:calc(var(--k)*1018);width:calc(var(--k)*588);top:calc(var(--k)*var(--t,0))}
/* theme toggle */
.lxtg{left:calc(var(--k)*1475);top:calc(var(--k)*57);width:calc(var(--k)*148);height:calc(var(--k)*55);display:flex;padding:0;border:0;border-radius:999px;overflow:hidden;cursor:pointer;background:linear-gradient(#fff,#efecef);box-shadow:0 calc(var(--k)*3) calc(var(--k)*12) #0000001f,inset 0 calc(var(--k)*1) calc(var(--k)*2) #fff;-webkit-tap-highlight-color:transparent}
.lxtg::before{content:"";position:absolute;left:0;top:0;width:56%;height:100%;border-radius:999px;background:linear-gradient(90deg,#e8110b,#b80000);box-shadow:0 calc(var(--k)*4) calc(var(--k)*10) #c8000a55;transition:left .25s,width .25s}
html[data-theme=dark] .lxtg::before{left:44%}
.lxtg span{position:relative;flex:1;display:grid;place-items:center;color:#5d5d63;transition:color .2s}
.lxtg svg{width:calc(var(--k)*26);height:calc(var(--k)*26)}
.lxtg span:first-child{color:#fff}
html[data-theme=dark] .lxtg span:first-child{color:#5d5d63}
html[data-theme=dark] .lxtg span:last-child{color:#fff}
/* heading */
.lxh1{margin:0;text-align:center;white-space:nowrap;font-weight:800;font-size:calc(var(--k)*54);line-height:calc(var(--k)*72);height:calc(var(--k)*72);letter-spacing:-.015em;color:#0d0d10}
.lxul{width:calc(var(--k)*372)!important;left:calc(var(--k)*1126)!important;height:auto;transform:rotate(-1.2deg)}
.lxsub{margin:0;text-align:center;font-size:calc(var(--k)*26);line-height:calc(var(--k)*36);height:calc(var(--k)*36);font-weight:500;color:#17171c}
/* fields */
.lxf{display:flex;align-items:center;height:calc(var(--k)*70);border:calc(var(--k)*1.5) solid #ddd8dc;border-radius:999px;background:linear-gradient(#fff,#f5f2f5);box-shadow:0 calc(var(--k)*3) calc(var(--k)*9) #3a1a2214,inset 0 calc(var(--k)*2) calc(var(--k)*3) #fff;transition:border-color .15s,box-shadow .15s}
.lxf:focus-within{border-color:#e30613;box-shadow:0 0 0 calc(var(--k)*4) #e3061326,0 calc(var(--k)*3) calc(var(--k)*9) #3a1a2214}

.lxf .lxic .kh{fill:#f7f4f6}

.lx .lxf input{flex:1;min-width:0;height:100%;margin-left:calc(var(--k)*37);padding:0 calc(var(--k)*130) 0 0;border:0!important;outline:0!important;background:transparent!important;box-shadow:none!important;font:500 max(16px,calc(var(--k)*23)) Inter,"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;color:#17171c}

.lxf input:not(:placeholder-shown)~.ar{opacity:0}

.lxeye:hover{color:#e30613}

/* remember / forgot */
.lxrow{left:calc(var(--k)*1021)!important;width:calc(var(--k)*577)!important;display:flex;align-items:center;justify-content:space-between;height:calc(var(--k)*32)}
.lxrem{display:flex;align-items:center;gap:calc(var(--k)*12);cursor:pointer;user-select:none;font-size:calc(var(--k)*20);font-weight:500;color:#1b1b20;white-space:nowrap}

.lxfp{padding:0;border:0;background:none;cursor:pointer;color:#d40000;font:500 max(12px,calc(var(--k)*19)) Inter,"Segoe UI",sans-serif;white-space:nowrap;text-decoration:underline;text-underline-offset:calc(var(--k)*4)}
.lxfp:hover{color:#a00000}
/* login button */
.lxbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*34);width:100%;height:calc(var(--k)*77);border:0;border-radius:999px;background:linear-gradient(180deg,#f0141a,#c20008 55%,#a80006);color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 calc(var(--k)*9) calc(var(--k)*18) #c8000a47,inset 0 calc(var(--k)*2) calc(var(--k)*3) #ffffff66;transition:filter .15s,transform .1s}
.lxform>.lxbtn{left:calc(var(--k)*1018);width:calc(var(--k)*584)}
.lxbtn:hover{filter:brightness(1.07)}.lxbtn:active{transform:translateY(1px)}.lxbtn:disabled{opacity:.65;cursor:default}
.lxbtn .tx{display:flex;align-items:center;gap:calc(var(--k)*20);font-size:calc(var(--k)*32);font-weight:700}
.lxbtn .tx em{font-style:normal;font-weight:500;font-size:calc(var(--k)*23);font-family:"IBM Plex Sans Arabic",Cairo,sans-serif;opacity:.9}
.lxbtn .go{flex:none;width:calc(var(--k)*44);height:calc(var(--k)*44);border-radius:50%;background:#fff;color:#d40000;display:grid;place-items:center;box-shadow:0 calc(var(--k)*2) calc(var(--k)*5) #0003}
.lxbtn .go svg{width:calc(var(--k)*22);height:calc(var(--k)*22)}
/* or + create account */
.lxor{display:flex;align-items:center;gap:calc(var(--k)*50);height:calc(var(--k)*24);font-size:calc(var(--k)*20);color:#1b1b20;left:calc(var(--k)*1030)!important;width:calc(var(--k)*560)!important}
.lxor::before,.lxor::after{content:"";flex:1;height:1px;background:#cfc9ce}
.lxalt{display:flex;align-items:center;left:calc(var(--k)*1090)!important;width:calc(var(--k)*437)!important;height:calc(var(--k)*68);padding:0 calc(var(--k)*22) 0 calc(var(--k)*34);border:calc(var(--k)*1.6) solid #2a2a2f;border-radius:999px;background:#ffffff8c;color:#17171c;cursor:pointer;font-family:inherit;transition:background .15s}
.lxalt:hover{background:#fff}

.lxft{display:flex;align-items:center;justify-content:center;gap:calc(var(--k)*26);height:calc(var(--k)*28);left:calc(var(--k)*1060)!important;width:calc(var(--k)*520)!important;font-size:calc(var(--k)*17);color:#3d4048;white-space:nowrap}

tr[data-lrow]{cursor:grab;-webkit-user-select:none;user-select:none}
body.dragmode tr[data-lrow]{cursor:grabbing}
.dgp{display:inline-grid;place-items:center;width:30px;height:30px;color:#9a9aa4;border-radius:9px;transition:background .15s,color .15s}
tr[data-lrow]:hover .dgp{color:#de0702;background:#de07021a}

/* ===== v22: search bar sits inside the red hero card (home only) ===== */
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{position:relative;z-index:3;height:54px;margin:0 18px -54px;padding-block:0;transform:translateY(18px);border-color:transparent;box-shadow:0 12px 26px -8px #0000006b}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input{height:100%;padding-block:0}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) #ubody>.hero.h2{padding-top:90px}
@media(max-width:700px){html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{margin-inline:10px}}

/* ===== v23: seamless robot image + glass search inside hero ===== */
html[data-theme] body:has(.ushell) .hero.h2 .hbn .rob{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent),linear-gradient(180deg,transparent 0,#000 36px);mask-image:linear-gradient(90deg,#000 70%,transparent),linear-gradient(180deg,transparent 0,#000 36px);-webkit-mask-composite:source-in;mask-composite:intersect}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) #ubody>.hero.h2{padding-top:84px}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{height:52px;margin:0 16px -52px;transform:translateY(16px);background:#ffffff26;border:1px solid #ffffff52;border-radius:16px;box-shadow:inset 0 1px 0 #ffffff40,0 12px 26px -12px #0000008c;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;transition:background .18s,border-color .18s,box-shadow .18s}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:hover{background:#ffffff33}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb .sbi{color:#fff}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input{color:#fff;caret-color:#fff;font-weight:600}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb input::placeholder{color:#ffe9e6;opacity:.82;font-weight:500}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb .x{background:#ffffff38;color:#fff}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within{background:#fff;border-color:#fff;box-shadow:0 0 0 4px #ffffff40,0 14px 30px -12px #0009}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within .sbi{color:#de0702}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within input{color:#17181d;caret-color:#de0702}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within input::placeholder{color:#8a8f9c}
html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb:focus-within .x{background:#eceef3;color:#444}
@media(max-width:700px){html[data-theme] body:has(.ushell) .uwrap:has(#ubody>.hero.h2) .sb{margin-inline:10px}}

/* ===== v24: no page scroll on employee view - only the list area scrolls ===== */
html[data-theme] body:has(.ushell){height:100vh;height:100dvh;overflow:hidden}
html[data-theme] body:has(.ushell) #app{height:100vh;height:100dvh;display:flex;flex-direction:column}
html[data-theme] body:has(.ushell) .uhead{flex:none}
html[data-theme] body:has(.ushell) .ushell{display:flex;flex:1 1 0;min-height:0;width:100%;align-items:stretch}

 if(pg==="list"&&LS(lopen)){const l=LS(lopen),n=l.folders.length,rs=l.folders.map((e,i)=>{const f=RS(e);return`<tr><td>${mv("fup","fdn",i,n,e.id)}</td><td dir="auto">${f?esc(f.name):"(deleted folder)"}${e.ref?' <span class="badge w">Existing</span>':""}</td><td>${f?f.blocks.length:0}</td><td>${f?`<button class="btn sm" data-act="aopen" data-id="${f.id}" data-from="list">Open</button>`:""}${e.ref?"":`<button class="btn gh sm" data-act="lfedit" data-id="${e.id}">Edit</button>`}<button class="btn rd sm" data-act="lrm" data-id="${e.id}">${e.ref?"Remove":"Delete"}</button></td></tr>`}).join("");
  return`<button class="btn gh bk" data-act="nav" data-id="lists">← Back to Lists</button><div class="hd"><h2 dir="auto">${esc(l.name)}</h2><div class="row"><button class="btn gh" data-act="lnew">+ New Folder</button><button class="btn" data-act="lpick">+ Add Existing Folders</button></div></div><div class="tw">${rs?`<table><tr><th>Order</th><th>Folder</th><th>Items</th><th>Actions</th></tr>${rs}</table>`:'<div class="empty">No folders in this list. Add existing ones or create a new folder.</div>'}</div>`}
 if(pg==="lists"){const n=S.lists.length,rs=S.lists.map((l,i)=>`<tr><td>${mv("lstup","lstdn",i,n,l.id)}</td><td dir="auto">${esc(l.name)}</td><td>${l.folders.length}</td><td>${lN(l)}</td><td><button class="btn sm" data-act="lopen" data-id="${l.id}">Open</button><button class="btn gh sm" data-act="editlist" data-id="${l.id}">Rename</button><button class="btn rd sm" data-act="dellist" data-id="${l.id}">Delete</button></td></tr>`).join("");
  return`<div class="hd"><h2>Lists</h2><button class="btn" data-act="addlist">+ Add List</button></div><p class="fdesc">Each list appears to employees in the side menu. Employees only see folders that are inside a list.</p><div class="tw">${rs?`<table><tr><th>Order</th><th>List Name</th><th>Folders</th><th>Items</th><th>Actions</th></tr>${rs}</table>`:'<div class="empty">No lists yet. Press + Add List.</div>'}</div>`}
 pg="folders";const rs=S.topics.map((c,i)=>`<tr><td>${mv("catup","catdn",i,FL.length,c.id)}</td><td dir="auto">${esc(c.name)}</td><td class="ncell" dir="auto">${esc(c.desc||"")}</td><td>${c.blocks.length}</td><td><button class="btn sm" data-act="aopen" data-id="${c.id}" data-from="folders">Open</button><button class="btn gh sm" data-act="editcat" data-id="${c.id}">Edit</button><button class="btn rd sm" data-act="delcat" data-id="${c.id}">Delete</button></td></tr>`).join("");
 return`<div class="hd"><h2>Folders</h2><button class="btn" data-act="addcat">+ Add Folder</button></div><div class="tw">${rs?`<table><tr><th>Order</th><th>Folder Name</th><th>Description</th><th>Items</th><th>Actions</th></tr>${rs}</table>`:'<div class="empty">No folders yet. Press + Add Folder.</div>'}</div>`}
function adminView(){const nav=[["dash",I.dash,"Dashboard"],["folders",I.folder,"Folders"],["lists",I.list,"Lists"],["view",I.users,"Employee View"]];
 $("#app").innerHTML=`<div class="top"><button class="tmn" data-act="menu" aria-label="Menu">${I.menu}</button><img src="${LOGO_T}" alt="etisalat"><div class="ttl2"><b>3aref Knowledge Hub</b><small>Admin Panel</small></div><span class="tsp"></span><button class="tg" data-act="theme" aria-label="Dark / Light mode">${TGI}</button></div><div class="shell"><div class="side${menu?" open":""}"><div class="sbrand"><img src="${LOGO_T}" alt="etisalat"><div><b>3aref</b><small>Admin Panel</small></div></div>${nav.map(n=>`<a class="${pg===n[0]||(pg==="list"&&n[0]==="lists")||(pg==="folder"&&n[0]===(ret==="list"?"lists":"folders"))?"on":""}" data-act="nav" data-id="${n[0]}">${n[1]}<span>${n[2]}</span></a>`).join("")}<div class="sp"></div><a class="tgl" data-act="theme">${TGI}<span class="lm">Dark Mode</span><span class="ld">Light Mode</span></a><div class="suser">${esc(ses.name)}</div><a class="lo" data-act="logout">${I.logout}<span>Logout</span></a></div><div class="main">${adminPage()}</div></div>`}
/* ---- login ---- */
function loginView(){$("#app").innerHTML=`<div class="lx" style="--plate:url(${LX_PLATE})"><div class="lxs">${LX_TOP()}<form class="lxform" id="lf" autocomplete="off" novalidate><h1 class="lxh1" style="--t:170">Welcome Back!</h1>${LX_UL}<p class="lxsub" style="--t:274">Login to your account</p><div class="lxf" style="--t:347">${LXI.u}<span class="dv"></span><input id="lu" name="u" placeholder="Username" autocapitalize="none" spellcheck="false"><span class="ar">اسم المستخدم</span></div><div class="lxf pw" style="--t:437">${LXI.p}<span class="dv"></span><input id="lp" name="p" type="password" placeholder="Password"><span class="ar">كلمة المرور</span><button type="button" class="lxeye" id="eye" aria-label="Show password">${IC_EYE_OFF}</button></div><div class="lxrow" style="--t:533"><label class="lxrem"><input type="checkbox" id="lrem" checked><span>Remember me</span></label><button type="button" class="lxfp" data-act="lxinfo" data-k="forgot">Forgot Password?</button></div><div class="lxerr" id="le" role="alert" style="--t:565"></div><button class="lxbtn" id="lbtn" style="--t:587"><span class="tx">Login<em>دخول</em></span>${LXI.go}</button><div class="lxor" style="--t:684">or</div><button type="button" class="lxalt" data-act="lxinfo" data-k="signup" style="--t:722">${LXI.up}<span class="dv2"></span><span class="t"><b>Create New Account</b></span><span class="lxcc">${LXI.chev}</span></button><div class="lxft" style="--t:836"><span>Powered by Innovation</span><i></i><span>Together for a Better Tomorrow</span></div></form></div></div>`;
 const fp=$("#lp");$("#eye").onclick=()=>{const s=fp.type==="password";fp.type=s?"text":"password";$("#eye").innerHTML=s?IC_EYE:IC_EYE_OFF};$("#lf").onsubmit=doLogin}
const LXMSG={forgot:["Forgot password?","Please contact your admin to reset your password.","تواصل مع مسؤول النظام لإعادة تعيين كلمة المرور."],signup:["Create New Account","Accounts are created by the admin. Please contact your admin to get access.","يتم إنشاء الحسابات بواسطة مسؤول النظام. تواصل معه للحصول على حساب."]};
function lxInfo(k){const m=LXMSG[k];if(!m)return;$("#modal").innerHTML=`<div class="ov"><div class="md"><h3>${m[0]}</h3><p>${m[1]}</p><p dir="rtl" style="margin-top:8px">${m[2]}</p><div class="row"><button type="button" class="btn" data-act="close">OK</button></div></div></div>`}
function render(){try{if(!ses)loginView();else if(isA()&&pg!=="view")adminView();else userView()}catch(e){console.error(e);$("#app").innerHTML='<div class="uwrap"><div class="card">Display error. <button class="btn" data-act="logout">Back to login</button></div></div>'}}
/* ---- forms ---- */
function fForm(c,l){formModal(c?"Edit Folder":"Add Folder",inp("Folder name","name",c?c.name:"","text",1)+txa("Description (optional)","desc",c?c.desc||"":""),"Save",d=>{const n=(d.name||"").trim();if(!n)return"Enter the folder name.";if(c){c.name=n;c.desc=(d.desc||"").trim()}else (l?l.folders:S.topics).push({id:uid(),name:n,desc:(d.desc||"").trim(),blocks:[]});save();render()})}
function lForm(l){formModal(l?"Rename List":"Add List",inp("List name","name",l?l.name:"","text",1),"Save",d=>{const n=(d.name||"").trim();if(!n)return"Enter the list name.";if(l)l.name=n;else S.lists.push({id:uid(),name:n,folders:[]});save();render()})}
function pForm(l){const have=new Set(l.folders.map(e=>e.ref).filter(Boolean)),av=S.topics.filter(t=>!have.has(t.id));if(!av.length){toast("No more folders to add","err");return}
 formModal("Add Existing Folders",av.map(t=>chk(esc(t.name),"x_"+t.id,0)).join(""),"Add",d=>{const ids=Object.keys(d).filter(k=>k.startsWith("x_")).map(k=>k.slice(2));if(!ids.length)return"Select at least one folder.";ids.forEach(id=>l.folders.push({id:uid(),ref:id}));save();render()})}
function bForm(b){const t=T(),ty=b?b.t:"text";formModal(b?"Edit Item":"Add Item",`<div class="fld"><label>Type</label>${b?`<input type="hidden" name="t" value="${b.t}"><input value="${TY[b.t]}" disabled>`:`<select name="t" id="bt">${Object.keys(TY).map(k=>`<option value="${k}">${TY[k]}</option>`).join("")}</select>`}</div>`+inp("Title","title",b?b.title:"")+`<div class="fld"><label>Content</label><textarea name="body" rows="9" dir="auto">${esc(b?b.body:"")}</textarea><small id="bh" style="color:var(--mut)">${HINT[ty]}</small></div>`,"Save",d=>{const o={t:d.t,title:(d.title||"").trim(),body:d.body||""};if(b)Object.assign(b,o);else t.blocks.push(Object.assign({id:uid()},o));save();render()});
 const s=$("#bt");if(s)s.onchange=()=>$("#bh").textContent=HINT[s.value]}
/* ---- events ---- */
function pos(){const m=$("#avm"),b=$("#avb");if(m&&b){const r=b.getBoundingClientRect();m.style.top=(r.bottom+10)+"px";m.style.right=Math.max(8,innerWidth-r.right)+"px";m.style.left="auto"}}
const swap=(a,i,d)=>{const j=i+d;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]"),m=$("#avm");if(m&&!(el&&el.dataset.act==="avmenu"))m.classList.remove("open");if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 switch(a){
 case"theme":{const d=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=d;try{localStorage.setItem(KEY,d)}catch(x){}break}
 case"menu":menu=!menu;$(".side").classList.toggle("open",menu);return;
 case"us_menu":uside=!uside;$$(".uside,.uov").forEach(x=>x.classList.toggle("open",uside));return;
 case"avmenu":{if(!m)return;m.classList.toggle("open");pos();return}
 case"logout":pg="dash";logout();return;
 case"close":closeModal();return;
 case"lxinfo":lxInfo(el.dataset.k);return;
 case"qclear":q="";$("#uq").value="";$("#qx").hidden=true;$("#ubody").innerHTML=userBody();return;
 case"shareopen":shareOpen();return;
 case"sharecopy":copyText(SHARE_URL).then(k=>toast(k?"Link copied":"Copy failed",k?"":"err"));return;
 case"sharemail":shareMail();return;
 case"urefresh":load().then(()=>{render();toast("Updated")});return;
 case"nav":menu=false;pg=id;cur=null;if(id==="lists"||id==="folders"||id==="dash"||id==="view")lopen=null;break;
 case"ucat":cur=id;q="";uside=false;if(el.dataset.lid)ulist=el.dataset.lid;window.scrollTo(0,0);break;
 case"ulist":ulist=id;cur=null;q="";uside=false;window.scrollTo(0,0);break;
 case"uhome":cur=ulist=null;q="";uside=false;break;
 case"uback":if(cur)cur=null;else ulist=null;break;
 case"aback":pg=cur?"folder":"dash";break;
 case"prev":pg="view";cur=id;ulist=el.dataset.lid||null;break;
 case"aopen":cur=id;pg="folder";ret=el.dataset.from||"folders";window.scrollTo(0,0);break;
 case"lopen":lopen=id;pg="list";break;
 case"addcat":fForm();return;case"editcat":fForm(F(id));return;
 case"delcat":confirmModal("Delete this folder and everything inside it?","Delete",()=>{S.topics=S.topics.filter(x=>x.id!==id);S.lists.forEach(l=>l.folders=l.folders.filter(e=>e.ref!==id));save();render()});return;
 case"catup":case"catdn":swap(S.topics,S.topics.findIndex(x=>x.id===id),a==="catup"?-1:1);return;
 case"addlist":lForm();return;case"editlist":lForm(LS(id));return;
 case"dellist":confirmModal("Delete this list? Folders you added from the Folders page stay safe.","Delete",()=>{S.lists=S.lists.filter(x=>x.id!==id);save();render()});return;
 case"lstup":case"lstdn":swap(S.lists,S.lists.findIndex(x=>x.id===id),a==="lstup"?-1:1);return;
 case"lnew":fForm(null,LS(lopen));return;case"lpick":pForm(LS(lopen));return;case"lfedit":fForm(F(id));return;
 case"fup":case"fdn":{const l=LS(lopen);swap(l.folders,l.folders.findIndex(x=>x.id===id),a==="fup"?-1:1);return}
 case"lrm":{const l=LS(lopen),e=l.folders.find(x=>x.id===id);confirmModal(e.ref?"Remove this folder from the list? The folder itself is not deleted.":"Delete this folder and everything inside it?",e.ref?"Remove":"Delete",()=>{l.folders=l.folders.filter(x=>x.id!==id);save();render()});return}
 case"badd":bForm();return;
 case"bedit":bForm(T().blocks.find(x=>x.id===id));return;
 case"bdel":confirmModal("Delete this item?","Delete",()=>{const t=T();t.blocks=t.blocks.filter(x=>x.id!==id);save();render()});return;
 case"bup":case"bdn":swap(T().blocks,T().blocks.findIndex(x=>x.id===id),a==="bup"?-1:1);return;
 default:return}
 render()});
document.addEventListener("input",e=>{if(e.target.id==="uq"){q=e.target.value;$("#qx").hidden=!q;$("#ubody").innerHTML=userBody()}});
(async()=>{$("#app").innerHTML=`<div class="boot"><div class="ldw"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="tr" cx="50" cy="50" r="46"/><circle class="ar" cx="50" cy="50" r="46"/></svg><img class="bootimg" src="${LOGO_W}" alt=""></div><div class="ldt">Loading</div></div>`;await load();
 try{const s=loadSes();if(s){ses={role:s.role,name:s.name};if(s.role==="admin"){tok={ref:s.ref,exp:0};try{await token()}catch(e){ses=tok=null}}}}catch(e){}
 render();setInterval(async()=>{if(ses&&!document.querySelector("#modal .ov")&&!document.hidden){const o=JSON.stringify(S);await load();if(JSON.stringify(S)!==o)render()}},60000)})();

</script>
